        /**

        const DB = {

            get(key, defaultVal) {
                try {
                    const data = localStorage.getItem(this.prefix + key);
                    return data ? JSON.parse(data) : defaultVal;
                } catch (e) {
                    console.error("DB Get Error", e);
                    return defaultVal;
                }
            },

            set(key, val) {
                try {
                    localStorage.setItem(this.prefix + key, JSON.stringify(val));
                } catch (e) {
                    console.error("DB Set Error", e);
                }
            },

            initSupabase() {
                const config = this.get("cloud_config", { enabled: false, url: "", anonKey: "" });
                if (config.enabled && config.url && config.anonKey && window.supabase) {
                    try {
                        this.supabaseClient = window.supabase.createClient(config.url, config.anonKey);
                        this.updateCloudStatus(true);
                    } catch (e) {
                        console.error("Supabase init error", e);
                        this.updateCloudStatus(false);
                    }
                } else {
                    this.supabaseClient = null;
                    this.updateCloudStatus(false);
                }
            },

            updateCloudStatus(connected) {
                const badge = document.getElementById("cloud-status-badge");
                const indicator = document.getElementById("cloud-indicator");
                const text = document.getElementById("cloud-status-text");
                if (!badge || !indicator || !text) return;

                if (connected) {
                    indicator.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                    text.textContent = "سحابي متصل (Supabase)";
                    badge.classList.remove("border-rose-400/30", "bg-rose-900/20");
                    badge.classList.add("border-emerald-400/40", "bg-emerald-950/40");
                } else {
                    indicator.className = "w-2 h-2 rounded-full bg-amber-400";
                    text.textContent = "قاعدة بيانات محلية";
                    badge.classList.remove("border-emerald-400/40", "bg-emerald-950/40");
                }
            },

            async syncToCloud() {
                if (!this.supabaseClient) return { success: false, message: "السحابة غير مفعلة، يرجى وضع Anon Key" };
                try {
                    const settings = this.get("system_settings", null);
                    const structure = this.get("structure", null);
                    const users = this.get("users", []);
                    const requests = this.get("requests", []);
                    const delegations = this.get("delegations", []);

                    if (settings) {
                        await this.supabaseClient.from('system_settings').upsert({
                            id: 'primary_config',
                            org_name: settings.orgName,
                            country_name: settings.countryName,
                            logo_url: settings.logoUrl || null,
                            work_start_time: settings.workStartTime,
                            work_end_time: settings.workEndTime,
                            report_margin: settings.reportMargin,
                            report_orientation: settings.reportOrientation,
                            show_qr_in_report: settings.showQRInReport,
                            show_sig_in_report: settings.showSignatureInReport
                        });
                    }

                    if (structure) {
                        await this.supabaseClient.from('org_structure').upsert({
                            id: 'current_structure',
                            structure_json: structure
                        });
                    }

                    if (users.length > 0) {
                        const mappedUsers = users.map(u => ({
                            id: u.id,
                            emp_id: u.empId || '',
                            username: u.username,
                            password_hash: u.passwordHash,
                            full_name: u.fullName,
                            role: u.role,
                            dept_id: u.deptId,
                            section_id: u.sectionId || null,
                            must_change_pass: !!u.mustChangePass,
                            signature: u.signature || null,
                            phone: u.phone || null,
                            title: u.title || ''
                        }));
                        await this.supabaseClient.from('app_users').upsert(mappedUsers);
                    }

                    if (requests.length > 0) {
                        const mappedReqs = requests.map(r => ({
                            id: r.id,
                            employee_id: r.employeeId,
                            employee_name: r.employeeName,
                            dept_id: r.deptId,
                            section_id: r.sectionId || null,
                            submission_date: r.submissionDate,
                            permission_date: r.permissionDate,
                            type: r.type,
                            start_time: r.startTime,
                            end_time: r.endTime || null,
                            total_hours: parseFloat(r.totalHours) || 1.0,
                            reason: r.reason,
                            status: r.status,
                            rejection_reason: r.rejectionReason || null,
                            approver_id: r.approverId || null,
                            approver_name: r.approverName || null,
                            approver_role: r.approverRole || null,
                            approved_at: r.approvedAt || null,
                            approval_signature: r.approvalSignature || null,
                            is_delegated: !!r.isDelegated
                        }));
                        await this.supabaseClient.from('permission_requests').upsert(mappedReqs);
                    }

                    const cloudConfig = this.get("cloud_config", {});
                    cloudConfig.lastSync = new Date().toLocaleString('ar-SA');
                    this.set("cloud_config", cloudConfig);

                    return { success: true, message: "تمت مزامنة ورفع كافة البيانات إلى Supabase بنجاح!" };
                } catch (err) {
                    console.error("Cloud upload error", err);
                    return { success: false, message: err.message || "حدث خطأ أثناء الاتصال بالسحابة" };
                }
            },

            async pullFromCloud() {
                if (!this.supabaseClient) return { success: false, message: "السحابة غير مهيأة" };
                try {
                    const { data: cUsers, error: uErr } = await this.supabaseClient.from('app_users').select('*');
                    if (uErr) throw uErr;
                    if (cUsers && cUsers.length > 0) {
                        const localUsers = cUsers.map(u => ({
                            id: u.id,
                            empId: u.emp_id,
                            username: u.username,
                            passwordHash: u.password_hash,
                            fullName: u.full_name,

                            sectionId: u.section_id || '',
                            mustChangePass: u.must_change_pass,
                            signature: u.signature,
                            phone: u.phone,
                            title: u.title
                        }));
                        this.set("users", localUsers);
                    }

                    const { data: cReqs, error: rErr } = await this.supabaseClient.from('permission_requests').select('*');
                    if (rErr) throw rErr;
                    if (cReqs) {
                        const localReqs = cReqs.map(r => ({
                            id: r.id,
                            employeeId: r.employee_id,
                            employeeName: r.employee_name,
                            deptId: r.dept_id,

                            submissionDate: r.submission_date,
                            permissionDate: r.permission_date,
                            type: r.type,
                            startTime: r.start_time,
                            endTime: r.end_time || '',
                            totalHours: r.total_hours,
                            reason: r.reason,
                            status: r.status,
                            rejectionReason: r.rejection_reason || '',
                            approverId: r.approver_id || '',
                            approverName: r.approver_name || '',
                            approverRole: r.approver_role || '',
                            approvedAt: r.approved_at || '',
                            approvalSignature: r.approval_signature || null,
                            isDelegated: r.is_delegated
                        }));
                        this.set("requests", localReqs);
                    }

                    const { data: cSettings } = await this.supabaseClient.from('system_settings').select('*').limit(1);
                    if (cSettings && cSettings.length > 0) {
                        const s = cSettings[0];
                        this.set("system_settings", {
                            orgName: s.org_name,

                        });
                    }

                    return { success: true, message: "تم سحب وتحديث البيانات من السحابة بنجاح!" };
                } catch (err) {
                    console.error("Cloud pull error", err);
                    return { success: false, message: err.message || "فشل جلب البيانات من السحابة" };

            }
        };

        /**
         * CORE APPLICATION LOGIC
         */
        const App = {
            currentUser: null,
            activeTab: 'dashboard',
            structure: null,
            tempUserSignature: null,
            tempUploadedLogo: undefined,

            init() {
                DB.init();
                this.structure = DB.get("structure", INITIAL_STRUCTURE);
                this.checkSession();
                this.render();
            },

            checkSession() {
                const savedUser = DB.get("current_user", null);
                if (savedUser) {
                    const users = DB.get("users", []);
                    const freshUser = users.find(u => u.id === savedUser.id);
                    this.currentUser = freshUser || savedUser;
                } else {
                    this.currentUser = null;
                }
            },

            getRoleTitle(role) {
                const map = {
                    'admin': 'مشرف عام النظام',
                    'general_manager': 'المدير العام',
                    'manager': 'مدير إدارة',
                    'head': 'رئيس قسم',
                    'employee': 'موظف'
                };
                return map[role] || 'موظف';
            },

            getArabicTypeName(type) {
                const map = {
                    'LATE_ARRIVAL': 'دخول متأخر',
                    'EARLY_EXIT': 'خروج مبكر',
                    'SPECIFIC_HOURS': 'استئذان بساعات محددة'
                };
                return map[type] || type;
            },

            formatTypeBadge(type) {
                if (type === 'LATE_ARRIVAL') {
                    return `<span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-lg text-xs inline-flex items-center gap-1"><i class="fa-solid fa-business-time"></i> دخول متأخر</span>`;
                } else if (type === 'EARLY_EXIT') {
                    return `<span class="bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-lg text-xs inline-flex items-center gap-1"><i class="fa-solid fa-door-open"></i> خروج مبكر</span>`;
                }
                return `<span class="bg-sky-100 text-sky-800 font-bold px-2.5 py-1 rounded-lg text-xs inline-flex items-center gap-1"><i class="fa-solid fa-clock"></i> ساعات محددة</span>`;
            },

            formatStatusBadge(status) {
                if (status === 'APPROVED') {
                    return `<span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full text-[11px] inline-flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> معتمد</span>`;
                } else if (status === 'REJECTED') {
                    return `<span class="bg-rose-100 text-rose-800 font-bold px-2 py-0.5 rounded-full text-[11px] inline-flex items-center gap-1"><i class="fa-solid fa-circle-xmark"></i> مرفوض</span>`;
                }
                return `<span class="bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full text-[11px] inline-flex items-center gap-1"><i class="fa-solid fa-clock-rotate-left"></i> قيد الانتظار</span>`;
            },

            closeModal() {
                const modal = document.getElementById("modal-container");
                if (modal) modal.innerHTML = "";
            },

            getSettings() {
                return DB.get("system_settings", {
                    orgName: "الإدارة العامة لتقنية المعلومات والتحول الرقمي",
                    countryName: "المملكة العربية السعودية",
                    logoUrl: "",
                    workStartTime: "07:30",
                    workEndTime: "14:30",
                    reportMargin: "10",
                    reportOrientation: "portrait",
                    showQRInReport: true,
                    showSignatureInReport: true
                });
            },

            togglePasswordVisibility(inputId, iconId) {
                const input = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                if (!input || !icon) return;

                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash", "text-emerald-700");
                } else {
                    input.type = "password";
                    icon.classList.remove("fa-eye-slash", "text-emerald-700");
                    icon.classList.add("fa-eye");
                }
            },

            notify(message, type = 'success') {
                const container = document.getElementById("toast-container");
                if (!container) return;
                const toast = document.createElement("div");
                const colors = {
                    success: "bg-emerald-700 text-white border-emerald-600",
                    error: "bg-rose-700 text-white border-rose-600",
                    warning: "bg-amber-600 text-white border-amber-500",
                    info: "bg-sky-700 text-white border-sky-600"
                };
                const icons = {
                    success: "fa-circle-check",
                    error: "fa-circle-xmark",
                    warning: "fa-triangle-exclamation",
                    info: "fa-circle-info"
                };

                toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border text-sm font-medium transition-all duration-300 transform translate-y-[-20px] opacity-0 pointer-events-auto ${colors[type] || colors.info}`;
                toast.innerHTML = `
                    <i class="fa-solid ${icons[type]} text-lg"></i>
                    <span>${message}</span>
                `;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.classList.remove("translate-y-[-20px]", "opacity-0");
                }, 10);

                setTimeout(() => {
                    toast.classList.add("translate-y-[-20px]", "opacity-0");
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            },

            setTab(tab) {
                this.activeTab = tab;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            logout() {
                this.currentUser = null;
                DB.set("current_user", null);
                this.activeTab = 'dashboard';
                this.notify("تم تسجيل الخروج بنجاح", "info");
                this.render();
            },

            getDeptName(deptId) {
                if (!deptId || deptId === "gd-1") return "الإدارة العامة لتقنية المعلومات والتحول الرقمي";
                const d = this.structure.departments.find(dept => dept.id === deptId);
                return d ? d.name : "غير محدد";
            },

            getSectionName(secId) {
                if (!secId) return "—";
                const direct = this.structure.directSections.find(s => s.id === secId);
                if (direct) return direct.name;

                for (let d of this.structure.departments) {
                    const sec = d.sections.find(s => s.id === secId);
                    if (sec) return sec.name;
                }
                return "غير محدد";
            },

            getUserApprover(user) {
                if (!user) return null;
                const users = DB.get("users", []);

                if (user.role === 'employee') {
                    if (user.sectionId) {
                        const head = users.find(u => u.sectionId === user.sectionId && (u.role === 'head' || u.id.startsWith("emp-sec")));
                        if (head && head.id !== user.id) return head;
                    }
                    const deptMgr = users.find(u => u.deptId === user.deptId && u.role === 'manager');
                    if (deptMgr && deptMgr.id !== user.id) return deptMgr;
                    return users.find(u => u.role === 'general_manager');
                }

                if (user.role === 'head') {
                    if (user.deptId === 'gd-1') {
                        return users.find(u => u.role === 'general_manager');
                    }
                    const deptMgr = users.find(u => u.deptId === user.deptId && u.role === 'manager');
                    if (deptMgr && deptMgr.id !== user.id) return deptMgr;
                    return users.find(u => u.role === 'general_manager');
                }

                if (user.role === 'manager') {
                    return users.find(u => u.role === 'general_manager');
                }

                return null;
            },

            isUserEligibleToApprove(approverUserId, req) {
                if (!this.currentUser) return false;
                if (this.currentUser.id === approverUserId) return true;
                if (this.currentUser.role === 'admin') return true;

                const delegations = DB.get("delegations", []);
                const today = new Date().toISOString().split('T')[0];
                return delegations.some(d => 
                    d.delegatorId === approverUserId &&
                    d.delegateeId === this.currentUser.id &&
                    d.status === 'ACTIVE' &&
                    today >= d.startDate &&
                    today <= d.endDate
                );
            },

            render() {
                this.renderHeader();
                const container = document.getElementById("view-container");

                if (!this.currentUser) {
                    container.innerHTML = this.renderLoginView();
                    return;
                }

                if (this.currentUser.mustChangePass) {
                    container.innerHTML = this.renderForceChangePasswordView();
                    return;
                }

                switch (this.activeTab) {
                    case 'dashboard': container.innerHTML = this.renderDashboardView(); break;
                    case 'new_request': container.innerHTML = this.renderNewRequestView(); break;
                    case 'my_requests': container.innerHTML = this.renderMyRequestsView(); break;
                    case 'approvals': container.innerHTML = this.renderApprovalsView(); break;
                    case 'delegations': container.innerHTML = this.renderDelegationsView(); break;
                    case 'admin_users': container.innerHTML = this.renderAdminUsersView(); break;
                    case 'admin_resets': container.innerHTML = this.renderAdminResetRequestsView(); break;
                    case 'settings': container.innerHTML = this.renderSettingsView(); break;
                    case 'reports': container.innerHTML = this.renderReportsView(); break;
                    case 'profile': container.innerHTML = this.renderProfileView(); break;
                    default: container.innerHTML = this.renderDashboardView();
                }

            renderHeader() {
                const navSec = document.getElementById("auth-nav-section");
                const subNav = document.getElementById("sub-nav-menu");

                const logoContainer = document.getElementById("header-logo-container");

                const footerHours = document.getElementById("footer-work-hours-badge");
                if (footerHours) footerHours.textContent = `ساعات العمل: ${settings.workStartTime} إلى ${settings.workEndTime}`;

                if (!this.currentUser) {
                    navSec.innerHTML = `
                        <div class="text-xs sm:text-sm bg-white/10 px-3 py-1.5 rounded-lg border border-white/20 text-emerald-100 flex items-center gap-2">
                            <i class="fa-solid fa-lock text-amber-300"></i>
                            <span>تسجيل الدخول للنظام</span>
                        </div>
                    `;
                    subNav.classList.add("hidden");

                }

                navSec.innerHTML = `
                    <div class="flex items-center gap-3">
                        <button onclick="App.setTab('profile')" class="text-right group flex items-center gap-2 hover:bg-white/10 p-1.5 rounded-xl transition">
                            <div class="w-10 h-10 rounded-full bg-amber-400/20 border border-amber-300 text-amber-300 flex items-center justify-center font-bold text-sm shadow">
                                ${this.currentUser.fullName.charAt(0)}
                            </div>
                            <div class="hidden sm:block text-right">
                                <div class="font-bold text-sm text-white group-hover:text-amber-200">${this.currentUser.fullName}</div>

                        </button>
                    </div>
                `;

                subNav.classList.remove("hidden");
                const reqCount = this.getPendingApprovalsCount();

                        id: 'approvals', 
                        name: 'صندوق الاعتمادات', 
                        icon: 'fa-clipboard-check',

                    });
                    tabs.push({ id: 'delegations', name: 'التفويض الإداري', icon: 'fa-user-clock' });
                }

                if (this.currentUser.role === 'admin') {
                    tabs.push({ id: 'admin_users', name: 'إدارة الموظفين والصلاحيات', icon: 'fa-users-gear' });
                    tabs.push({ 
                        id: 'admin_resets', 
                        name: 'طلبات استعادة الكلمات', 
                        icon: 'fa-key',
                        badge: resetCount > 0 ? resetCount : null 
                    });
                    tabs.push({ id: 'settings', name: 'إعدادات النظام والدوام', icon: 'fa-sliders' });
                }

                tabs.push({ id: 'reports', name: 'التقارير والإحصائيات', icon: 'fa-chart-pie' });

                subNav.firstElementChild.innerHTML = tabs.map(t => `
                    <button onclick="App.setTab('${t.id}')" class="flex items-center gap-2 px-3.5 py-2 rounded-lg font-medium text-xs sm:text-sm whitespace-nowrap transition relative ${

                        <i class="fa-solid ${t.icon}"></i>
                        <span>${t.name}</span>
                        ${t.badge ? `<span class="bg-rose-500 text-white font-bold text-[10px] px-1.5 py-0.5 rounded-full ml-1 animate-pulse">${t.badge}</span>` : ''}
                    </button>
                `).join('');
            },

            getPendingApprovalsCount() {
                if (!this.currentUser) return 0;
                const requests = DB.get("requests", []);
                return requests.filter(r => {
                    if (r.status !== 'PENDING') return false;
                    const approver = this.getUserApprover(DB.get("users", []).find(u => u.id === r.employeeId));
                    return approver && this.isUserEligibleToApprove(approver.id, r);
                }).length;

                                <button type="button" onclick="App.togglePasswordVisibility('login-password', 'eye-login-password')" class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 hover:text-slate-600">

                                <div>• <strong>موظف تجريبي:</strong> ahmed_dev | كلمة المرور: <code class="bg-amber-200/60 px-1 rounded font-mono">temp1234</code></div>
                            </div>
                        </div>
                    </form>
                </div>
                `;

            handleLogin(e) {
                e.preventDefault();
                const u = document.getElementById("login-username").value.trim();
                const p = document.getElementById("login-password").value;

                const users = DB.get("users", []);
                const found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.passwordHash === p);

                if (!found) {
                    this.notify("اسم المستخدم أو كلمة المرور غير صحيحة!", "error");
                    return;
                }

                this.currentUser = found;
                DB.set("current_user", found);
                this.notify(`أهلاً بك، ${found.fullName}`, "success");
                this.render();
            },

            renderForceChangePasswordView() {
                return `
                <div class="max-w-md mx-auto my-8 bg-white rounded-2xl shadow-xl border border-rose-100 overflow-hidden">
                    <div class="bg-gradient-to-r from-amber-600 to-rose-700 p-6 text-white text-center">
                        <div class="w-14 h-14 bg-white/20 rounded-2xl mx-auto flex items-center justify-center text-2xl text-white mb-2 shadow-inner">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <h2 class="text-lg font-black">إلزام بتغيير كلمة المرور المؤقتة</h2>
                        <p class="text-xs text-amber-100 mt-1">لحماية حسابك وبياناتك الإدارية، يرجى تعيين كلمة مرور شخصية جديدة للاستمرار.</p>
                    </div>

                    <form onsubmit="App.handleForceChangePassword(event)" class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور الجديدة</label>
                            <div class="relative">
                                <input type="password" id="new-password" required minlength="6" placeholder="على الأقل 6 خانات..."
                                    class="w-full pl-10 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white" />
                                <button type="button" onclick="App.togglePasswordVisibility('new-password', 'eye-new-pass')" class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 hover:text-slate-600">
                                    <i id="eye-new-pass" class="fa-solid fa-eye text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <div>

                            <div class="relative">

                                    class="w-full pl-10 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white" />
                                <button type="button" onclick="App.togglePasswordVisibility('confirm-password', 'eye-confirm-pass')" class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 hover:text-slate-600">
                                    <i id="eye-confirm-pass" class="fa-solid fa-eye text-sm"></i>
                                </button>
                            </div>
                        </div>

                        <div class="text-[11px] text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <span class="font-bold text-slate-700"><i class="fa-solid fa-shield-check text-emerald-600"></i> معايير الأمان:</span>
                            يجب ألا تقل عن 6 أحرف أو أرقام، ولا يمكن تصفح النظام قبل حفظ هذه الخطوة.
                        </div>

                    </form>
                </div>
                `;
            },

            handleForceChangePassword(e) {
                e.preventDefault();
                const p1 = document.getElementById("new-password").value;
                const p2 = document.getElementById("confirm-password").value;

                if (p1 !== p2) {
                    this.notify("كلمتا المرور غير متطابقتين!", "error");
                    return;
                }

                if (p1.length < 6) {
                    this.notify("يجب أن تتكون كلمة المرور من 6 أحرف على الأقل", "warning");
                    return;
                }

                const users = DB.get("users", []);
                const idx = users.findIndex(u => u.id === this.currentUser.id);
                if (idx !== -1) {
                    users[idx].passwordHash = p1;
                    users[idx].mustChangePass = false;
                    DB.set("users", users);

                const settings = this.getSettings();

                                        class="w-full px-3 py-2 bg-emerald-50/70 border border-emerald-200 rounded-xl text-sm font-bold text-emerald-800 cursor-not-allowed" />
                                    <span class="absolute left-3 top-2 text-xs font-bold text-emerald-600">ساعة</span>
                                </div>
                                <span class="text-[10px] text-slate-400 mt-1 block">تحتسب آلياً بحسب فارق وقت الحضور عن بداية الدوام</span>
                            </div>
                        </div>
                    `;
                    this.calculateAutomaticHours('LATE_ARRIVAL');
                } else if (type === 'EARLY_EXIT') {
                    const [eh, em] = settings.workEndTime.split(':').map(Number);
                    let earlyHour = eh - 1;
                    if (earlyHour < 0) earlyHour = 12;
                    const defaultExitTime = String(earlyHour).padStart(2, '0') + ":" + String(em).padStart(2, '0');

                    box.innerHTML = `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                                <input type="time" id="time-start" required value="${defaultExitTime}" onchange="App.calculateAutomaticHours('EARLY_EXIT')"
                                    class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm font-semibold" />
                                <span class="text-[11px] text-slate-500 mt-1 block">
                                    نهاية الدوام المعتمدة في النظام: <strong class="text-emerald-700 font-mono">${settings.workEndTime}</strong>
                                </span>

                        </div>
                    `;
                    this.calculateAutomaticHours('EARLY_EXIT');
                } else {
                    box.innerHTML = `
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">وقت بداية الخروج <span class="text-rose-500">*</span></label>
                                <input type="time" id="time-start" required value="10:00" onchange="App.calculateAutomaticHours('SPECIFIC_HOURS')"

                            </div>
                            <div>

                                <input type="time" id="time-end" required value="12:00" onchange="App.calculateAutomaticHours('SPECIFIC_HOURS')"
                                    class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl text-sm font-semibold" />
                            </div>

                                </div>
                            </div>

                    `;
                    this.calculateAutomaticHours('SPECIFIC_HOURS');
                }
            },

            calculateAutomaticHours(type) {
                const settings = this.getSettings();
                const totalInput = document.getElementById("total-hours-input");
                if (!totalInput) return;

                if (type === 'LATE_ARRIVAL') {
                    const startVal = document.getElementById("time-start")?.value;
                    if (!startVal) return;

                    const [wh, wm] = settings.workStartTime.split(':').map(Number);
                    const [ah, am] = startVal.split(':').map(Number);

                    let workStartMins = wh * 60 + wm;
                    let arrivalMins = ah * 60 + am;

                    let diffMins = arrivalMins - workStartMins;
                    if (diffMins < 0) diffMins = 0;
                    const hours = (diffMins / 60).toFixed(1);
                    totalInput.value = hours > 0 ? hours : 0.5;
                } else if (type === 'EARLY_EXIT') {
                    const exitVal = document.getElementById("time-start")?.value;
                    if (!exitVal) return;

                    const [eh, em] = settings.workEndTime.split(':').map(Number);
                    const [xh, xm] = exitVal.split(':').map(Number);

                    let workEndMins = eh * 60 + em;
                    let exitMins = xh * 60 + xm;

                    let diffMins = workEndMins - exitMins;
                    if (diffMins < 0) diffMins = 0;
                    const hours = (diffMins / 60).toFixed(1);
                    totalInput.value = hours > 0 ? hours : 0.5;
                } else {
                    const s = document.getElementById("time-start")?.value;
                    const e = document.getElementById("time-end")?.value;
                    if (s && e) {
                        const [sh, sm] = s.split(':').map(Number);
                        const [eh, em] = e.split(':').map(Number);
                        let diffMinutes = (eh * 60 + em) - (sh * 60 + sm);
                        if (diffMinutes < 0) diffMinutes = 0;
                        const diffHours = (diffMinutes / 60).toFixed(1);
                        totalInput.value = diffHours > 0 ? diffHours : 1.0;
                    }
                }
            },

            handleSubmitPermission(e) {
                e.preventDefault();
                const permDate = document.getElementById("perm-date").value;
                const permType = document.querySelector('input[name="permType"]:checked').value;
                const startTime = document.getElementById("time-start").value;
                const endTime = document.getElementById("time-end")?.value || "";
                const totalHours = parseFloat(document.getElementById("total-hours-input").value) || 1.0;
                const reason = document.getElementById("perm-reason").value.trim();

                const requests = DB.get("requests", []);
                const newReq = {
                    id: "REQ-" + new Date().getFullYear() + "-" + String(requests.length + 1).padStart(3, '0'),
                    employeeId: this.currentUser.id,
                    employeeName: this.currentUser.fullName,
                    deptId: this.currentUser.deptId,
                    sectionId: this.currentUser.sectionId || "",
                    submissionDate: new Date().toISOString().split('T')[0],
                    permissionDate: permDate,
                    type: permType,
                    startTime: startTime,
                    endTime: endTime,
                    totalHours: totalHours,
                    reason: reason,
                    status: "PENDING",
                    rejectionReason: "",
                    approverId: "",
                    approverName: "",
                    approverRole: "",
                    approvedAt: "",
                    approvalSignature: null,
                    isDelegated: false
                };

                requests.unshift(newReq);
                DB.set("requests", requests);
                this.notify("تم رفع طلب الاستئذان بنجاح وهو الآن بانتظار الاعتماد!", "success");
                this.setTab("my_requests");
            },

                                <span>سجل استئذاناتي الخاصة</span>
                            </h2>
                            <p class="text-xs text-slate-500 mt-1">تتبع حالة طلباتك، تعديلها قبل الاعتماد، أو طباعة القرار الرسمي بعد الموافقة.</p>
                        </div>
                        <button onclick="App.setTab('new_request')" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5 self-start sm:self-auto">
                            <i class="fa-solid fa-plus"></i> تقديم طلب جديد
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        ${this.renderRequestsTable(myReqs, false)}
                    </div>
                </div>
                `;
            },

            renderRequestsTable(reqList, isCompact = false) {
                if (!reqList || reqList.length === 0) {
                    return `
                    <div class="p-8 text-center text-slate-400 space-y-2">
                        <i class="fa-solid fa-folder-open text-4xl text-slate-300"></i>
                        <p class="text-xs font-semibold">لا توجد طلبات استئذان مسجلة حتى الآن</p>
                    </div>
                    `;
                }

                return `
                <table class="w-full text-right text-xs">
                    <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                        <tr>
                            <th class="p-3.5">رقم الطلب</th>
                            <th class="p-3.5">تاريخ الاستئذان</th>
                            <th class="p-3.5">نوع الاستئذان</th>
                            <th class="p-3.5">الوقت / الساعات</th>
                            <th class="p-3.5">السبب</th>
                            <th class="p-3.5">الحالة</th>
                            <th class="p-3.5 text-center">الإجراءات والقرار</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${reqList.map(r => {
                            const isPending = r.status === 'PENDING';
                            const isApproved = r.status === 'APPROVED';
                            const isRejected = r.status === 'REJECTED';
                            const canEditOrDelete = (this.currentUser.role === 'admin') || (this.currentUser.id === r.employeeId && isPending);

                            let timeDetails = `${r.totalHours} ساعة`;
                            if (r.type === 'LATE_ARRIVAL') timeDetails = `دخول: ${r.startTime} (${r.totalHours} س)`;
                            else if (r.type === 'EARLY_EXIT') timeDetails = `خروج: ${r.startTime} (${r.totalHours} س)`;
                            else if (r.type === 'SPECIFIC_HOURS') timeDetails = `${r.startTime} إلى ${r.endTime} (${r.totalHours} س)`;

                            return `
                            <tr class="hover:bg-slate-50/80 transition">
                                <td class="p-3.5 font-bold font-mono text-slate-800">${r.id}</td>
                                <td class="p-3.5 font-semibold text-slate-700">${r.permissionDate}</td>
                                <td class="p-3.5">${this.formatTypeBadge(r.type)}</td>
                                <td class="p-3.5 font-bold text-slate-800 font-mono">${timeDetails}</td>
                                <td class="p-3.5 text-slate-600 max-w-xs truncate" title="${r.reason}">${r.reason}</td>
                                <td class="p-3.5">${this.formatStatusBadge(r.status)}</td>
                                <td class="p-3.5 text-center">
                                    <div class="flex items-center justify-center gap-1.5">
                                        ${isApproved ? `
                                            <button onclick="App.openDecisionModal('${r.id}')" title="عرض وطباعة القرار الرسمي" class="p-1.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 rounded-lg text-xs font-bold transition flex items-center gap-1">
                                                <i class="fa-solid fa-stamp"></i>
                                                <span class="hidden sm:inline">القرار</span>
                                            </button>
                                        ` : ''}

                                        ${isRejected ? `
                                            <button onclick="App.openRejectionReasonModal('${r.id}')" title="عرض سبب الرفض" class="p-1.5 bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 rounded-lg text-xs font-bold transition">
                                                <i class="fa-solid fa-circle-exclamation"></i>
                                            </button>
                                        ` : ''}

                                        ${canEditOrDelete ? `
                                            <button onclick="App.openEditRequestModal('${r.id}')" title="تعديل الطلب" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg transition">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>
                                            <button onclick="App.confirmDeleteRequest('${r.id}')" title="حذف الطلب" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg transition">
                                                <i class="fa-solid fa-trash-can"></i>
                                            </button>
                                        ` : `
                                            ${!isApproved && !isRejected ? '' : `
                                                <span class="text-[11px] text-slate-400 font-medium" title="تم قفل التعديل لاتخاذ قرار إداري">
                                                    <i class="fa-solid fa-lock text-slate-300"></i>
                                                </span>
                                            `}
                                        `}
                                    </div>
                                </td>
                            </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
                `;
            },

            renderApprovalsView() {
                const requests = DB.get("requests", []);
                const users = DB.get("users", []);

                const pendingList = requests.filter(r => {
                    if (r.status !== 'PENDING') return false;
                    const emp = users.find(u => u.id === r.employeeId);
                    const approver = this.getUserApprover(emp);
                    return approver && this.isUserEligibleToApprove(approver.id, r);
                });

                return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-clipboard-check text-emerald-700"></i>
                                <span>صندوق طلبات الاستئذان الواردة للاعتماد</span>
                            </h2>
                            <p class="text-xs text-slate-500 mt-1">يمكنك مراجعة أسباب الاستئذان، واعتماد الطلب بتوقيعك الإلكتروني أو رفضه مع إلزام كتابة السبب.</p>
                        </div>
                        <span class="bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-xl text-xs">
                            ${pendingList.length} طلبات قيد الانتظار
                        </span>
                    </div>

                    <div class="space-y-4">
                        ${pendingList.length === 0 ? `
                            <div class="bg-white p-12 text-center rounded-2xl border border-slate-200 text-slate-400 space-y-2">
                                <i class="fa-solid fa-check-double text-5xl text-emerald-400"></i>
                                <h4 class="font-bold text-slate-700 text-sm">صندوق الاعتمادات فارغ</h4>
                                <p class="text-xs">تمت معالجة كافة طلبات الاستئذان الواردة لاختصاصك بنجاح.</p>
                            </div>
                        ` : pendingList.map(r => `
                            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-slate-100 gap-2">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 flex items-center justify-center font-bold text-sm">
                                            ${r.employeeName.charAt(0)}
                                        </div>
                                        <div>
                                            <div class="font-bold text-sm text-slate-900">${r.employeeName}</div>
                                            <div class="text-[11px] text-slate-500">
                                                ${this.getDeptName(r.deptId)} — قسم: ${this.getSectionName(r.sectionId)}
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-mono text-xs bg-slate-100 px-2 py-1 rounded font-bold">${r.id}</span>
                                        ${this.formatTypeBadge(r.type)}
                                    </div>
                                </div>

                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-xl text-xs">
                                    <div>
                                        <span class="text-slate-400 block text-[10px]">تاريخ الاستئذان:</span>
                                        <span class="font-bold text-slate-800">${r.permissionDate}</span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block text-[10px]">الوقت المحسوب:</span>
                                        <span class="font-bold text-slate-800 font-mono">${r.totalHours} ساعة</span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block text-[10px]">وقت الانصراف / الحضور:</span>
                                        <span class="font-bold text-slate-800 font-mono">${r.startTime} ${r.endTime ? `إلى ${r.endTime}` : ''}</span>
                                    </div>
                                    <div>
                                        <span class="text-slate-400 block text-[10px]">تاريخ رفع الطلب:</span>
                                        <span class="font-bold text-slate-800">${r.submissionDate}</span>
                                    </div>
                                </div>

                                <div class="text-xs bg-amber-50/60 p-3 rounded-xl border border-amber-200/60">
                                    <span class="font-bold text-amber-900 block mb-1"><i class="fa-solid fa-align-right ml-1"></i>سبب ومبرر الاستئذان:</span>
                                    <p class="text-slate-700 leading-relaxed">${r.reason}</p>
                                </div>

                                <div class="flex items-center justify-end gap-3 pt-2">
                                    <button onclick="App.openRejectModal('${r.id}')" class="px-4 py-2 bg-rose-50 text-rose-700 hover:bg-rose-100 border border-rose-200 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                                        <i class="fa-solid fa-xmark"></i> رفض الطلب
                                    </button>
                                    <button onclick="App.handleApproveRequest('${r.id}')" class="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5">
                                        <i class="fa-solid fa-signature"></i> اعتماد وتوقيع الموافقة
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                `;
            },

            handleApproveRequest(reqId) {
                const requests = DB.get("requests", []);
                const idx = requests.findIndex(r => r.id === reqId);
                if (idx === -1) return;

                const req = requests[idx];
                const emp = DB.get("users", []).find(u => u.id === req.employeeId);
                const formalApprover = this.getUserApprover(emp);
                const isDelegated = formalApprover && formalApprover.id !== this.currentUser.id;

                req.status = 'APPROVED';
                req.approverId = this.currentUser.id;
                req.approverName = this.currentUser.fullName;
                req.approverRole = this.currentUser.title || this.getRoleTitle(this.currentUser.role);
                req.approvedAt = new Date().toLocaleString('ar-SA');
                req.approvalSignature = this.currentUser.signature || null;
                req.isDelegated = isDelegated;

                DB.set("requests", requests);
                this.notify(`تم اعتماد وتوقيع طلب الاستئذان (${req.id}) بنجاح!`, "success");
                this.render();
            },

            openRejectModal(reqId) {
                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-rose-700 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-ban"></i>
                                <span>رفض طلب الاستئذان (${reqId})</span>
                            </h3>
                            <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onsubmit="App.handleConfirmReject(event, '${reqId}')" class="space-y-4 text-xs">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">سبب ومبرر الرفض الإلزامي <span class="text-rose-500">*</span></label>
                                <textarea id="reject-reason" required rows="3" placeholder="اكتب هنا سبب الرفض بالتفصيل ليظهر للموظف..."
                                    class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white resize-none"></textarea>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-2">
                                <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-700">إلغاء</button>
                                <button type="submit" class="px-5 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold shadow">تأكيد الرفض</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            },

            handleConfirmReject(e, reqId) {
                e.preventDefault();
                const reason = document.getElementById("reject-reason").value.trim();
                if (!reason) return;

                const requests = DB.get("requests", []);
                const idx = requests.findIndex(r => r.id === reqId);
                if (idx !== -1) {
                    requests[idx].status = 'REJECTED';
                    requests[idx].rejectionReason = reason;
                    requests[idx].approverId = this.currentUser.id;
                    requests[idx].approverName = this.currentUser.fullName;
                    requests[idx].approvedAt = new Date().toLocaleString('ar-SA');
                    DB.set("requests", requests);
                    this.closeModal();
                    this.notify("تم رفض طلب الاستئذان وتوثيق السبب بنجاح", "info");
                    this.render();
                }
            },

            renderDelegationsView() {
                const delegations = DB.get("delegations", []);
                const users = DB.get("users", []).filter(u => u.id !== this.currentUser.id && u.username !== 'admin');
                const myDelegations = delegations.filter(d => d.delegatorId === this.currentUser.id || this.currentUser.role === 'admin');

                return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-user-clock text-emerald-700"></i>
                                <span>نظام التفويض الإداري أثناء الإجازة</span>
                            </h2>
                            <p class="text-xs text-slate-500 mt-1">تفويض صلاحيات اعتماد ورفض الاستئذانات لمدير آخر أو موظف خلال فترة غيابك أو إجازتك.</p>
                        </div>
                        <button onclick="App.openCreateDelegationModal()" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5 self-start sm:self-auto">
                            <i class="fa-solid fa-plus"></i> إنشاء تفويض جديد
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        ${myDelegations.length === 0 ? `
                            <div class="p-8 text-center text-slate-400 space-y-2">
                                <i class="fa-solid fa-handshake-slash text-4xl text-slate-300"></i>
                                <p class="text-xs font-semibold">لا توجد تفويضات إدارية مسجلة حالياً</p>
                            </div>
                        ` : `
                            <table class="w-full text-right text-xs">
                                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                    <tr>
                                        <th class="p-3.5">المفوِّض (الأصيل)</th>
                                        <th class="p-3.5">المفوَّض له (النائب)</th>
                                        <th class="p-3.5">فترة التفويض</th>
                                        <th class="p-3.5">السبب الإداري</th>
                                        <th class="p-3.5">الحالة</th>
                                        <th class="p-3.5 text-center">الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${myDelegations.map(d => `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="p-3.5 font-bold text-slate-900">${d.delegatorName}</td>
                                            <td class="p-3.5 font-bold text-emerald-800">${d.delegateeName}</td>
                                            <td class="p-3.5 font-mono text-slate-700">من ${d.startDate} إلى ${d.endDate}</td>
                                            <td class="p-3.5 text-slate-600">${d.reason}</td>
                                            <td class="p-3.5">
                                                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full">ساري المفعول</span>
                                            </td>
                                            <td class="p-3.5 text-center">
                                                <button onclick="App.deleteDelegation('${d.id}')" title="إلغاء التفويض" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg transition font-bold">
                                                    <i class="fa-solid fa-trash-can"></i> إلغاء
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `}
                    </div>
                </div>
                `;
            },

            openCreateDelegationModal() {
                const users = DB.get("users", []).filter(u => u.id !== this.currentUser.id && u.username !== 'admin');
                const today = new Date().toISOString().split('T')[0];

                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-user-shield text-emerald-700"></i>
                                <span>إصدار تفويض إداري لصلاحيات الاستئذان</span>
                            </h3>
                            <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onsubmit="App.handleSaveDelegation(event)" class="space-y-3 text-xs">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">الموظف / المدير المفوَّض له <span class="text-rose-500">*</span></label>
                                <select id="delegation-user" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                                    <option value="">-- اختر الشخص المفوض --</option>
                                    ${users.map(u => `
                                        <option value="${u.id}">${u.fullName} (${this.getRoleTitle(u.role)} - ${this.getDeptName(u.deptId)})</option>
                                    `).join('')}
                                </select>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">تاريخ بداية التفويض <span class="text-rose-500">*</span></label>
                                    <input type="date" id="del-start" required value="${today}" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl" />
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">تاريخ نهاية التفويض <span class="text-rose-500">*</span></label>
                                    <input type="date" id="del-end" required value="${today}" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl" />
                                </div>
                            </div>

                            <div>
                                <label class="block font-bold text-slate-700 mb-1">سبب التفويض (مثال: إجازة اعتيادية) <span class="text-rose-500">*</span></label>
                                <input type="text" id="del-reason" required placeholder="مثال: تمتع بإجازة سنوية واعتيادية" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl" />
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-2">
                                <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-700">إلغاء</button>
                                <button type="submit" class="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold shadow">حفظ وتفعيل التفويض</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            },

            handleSaveDelegation(e) {
                e.preventDefault();
                const delegateeId = document.getElementById("delegation-user").value;
                const startDate = document.getElementById("del-start").value;
                const endDate = document.getElementById("del-end").value;
                const reason = document.getElementById("del-reason").value.trim();

                const users = DB.get("users", []);
                const delegatee = users.find(u => u.id === delegateeId);
                if (!delegatee) return;

                const delegations = DB.get("delegations", []);
                delegations.push({
                    id: "DEL-" + Date.now(),
                    delegatorId: this.currentUser.id,
                    delegatorName: this.currentUser.fullName,
                    delegateeId: delegatee.id,
                    delegateeName: delegatee.fullName,
                    startDate: startDate,
                    endDate: endDate,
                    reason: reason,
                    status: 'ACTIVE'
                });

                DB.set("delegations", delegations);
                this.closeModal();
                this.notify(`تم تفعيل التفويض الإداري للزميل (${delegatee.fullName}) بنجاح!`, "success");
                this.render();
            },

            deleteDelegation(delId) {
                let delegations = DB.get("delegations", []);
                delegations = delegations.filter(d => d.id !== delId);
                DB.set("delegations", delegations);
                this.notify("تم إلغاء التفويض بنجاح", "info");
                this.render();
            },

            renderAdminUsersView() {
                if (this.currentUser.role !== 'admin') {
                    return `<div class="p-8 text-center text-rose-600 font-bold">عذراً، هذه الشاشة مخصصة لمدير النظام فقط.</div>`;
                }

                const users = DB.get("users", []);

                return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-users-gear text-emerald-700"></i>
                                <span>إدارة الموظفين والقيادات وصلاحيات النظام</span>
                            </h2>

            },

            openCreateUserModal() {

                this.tempUserSignature = null;

                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 my-6">
                        <div class="flex items-center justify-between border-b pb-3">

                            </h3>
                            <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
