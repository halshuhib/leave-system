    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        @media print {
            body * {
                visibility: hidden !important;
            }
            /* طباعة القرار الفردي */
            body.print-mode-resolution #printableResolutionContainer,
            body.print-mode-resolution #printableResolutionContainer * {
                visibility: visible !important;
            }
            body.print-mode-resolution #printableResolutionContainer {

                top: 0 !important;
                width: 100% !important;

                box-sizing: border-box !important;

            /* طباعة الكشف السردي الإجمالي */
            body.print-mode-report #reportPrintableArea,
            body.print-mode-report #reportPrintableArea * {
                visibility: visible !important;
            }
            body.print-mode-report #reportPrintableArea {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 10mm !important;
                background-color: #ffffff !important;
                box-sizing: border-box !important;
                z-index: 999999 !important;
            }

            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center w-full max-w-md px-4 pointer-events-none"></div>

                        </span>
                        <span class="text-[10px] font-mono px-2 py-0.5 bg-emerald-950 text-emerald-300 rounded border border-emerald-800">v4.2.0</span>

            </div>

            <!-- لوحة المستخدم العلوية -->
            <div id="userHeaderPanel" class="hidden flex items-center gap-3">
                <div class="bg-emerald-950/60 border border-emerald-700/50 rounded-xl px-3 py-1.5 flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow">
                        <span id="userAvatarText">م</span>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-sm leading-tight" id="headerUserName">اسم المستخدم</div>

                    </div>
                </div>
                <button onclick="App.logout()" title="تسجيل الخروج" class="p-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white transition shadow flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>

        </div>

        <!-- أزرار التبويبات -->
        <nav id="navTabsContainer" class="hidden bg-emerald-800/80 border-t border-emerald-700/50 px-4">
            <div class="max-w-7xl mx-auto flex gap-1 overflow-x-auto py-1.5" id="tabsList"></div>
        </nav>
    </header>

    <!-- الحاوية الأساسية للشاشات -->

    <!-- النافذة المنبثقة الشاملة -->

        <div id="modalContent" class="bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto transform transition-all p-6 text-right"></div>
    </div>

    <!-- حاوية طباعة القرار الفردي المعزولة -->

    <script>
    const SYSTEM_VERSION = "v4.2.0";

    // بيانات الاتصال السحابي الثابتة
    const CLOUD_CONFIG = {
        url: "https://psdiohmcupwcxnascxft.supabase.co",
        key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzZGlvaG1jdXB3Y3huYXNjeGZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDcyNDQsImV4cCI6MjEwODc4MzI0NH0.iBmChbFHJnrVTHK-pcNpUzLjU5VM75ZfI7DkOjBDQx8"
    };

    // قاموس الأيقونات المدمجة برمجياً
    const Icons = {
        dashboard: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>`,
        requests: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
        approvals: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`,
        delegations: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>`,
        reports: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`,
        users: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>`,
        resets: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>`,
        settings: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`,
        print: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>`
    };

    const DB_DEFAULT = {
        settings: {
            orgName: "المملكة العربية السعودية",
            generalDept: "الإدارة العامة لتقنية المعلومات والتحول الرقمي",
            reportHeaderTitle: "كشف حصر ومتابعة الاستئذانات الإدارية (الإجمالي السردي)",
            logoData: "",
            workStartTime: "07:30",
            workEndTime: "14:30",
            reportMargin: "10",
            reportOrientation: "portrait",
            showQRInReport: true,
            showSignatureInReport: true,
            supabaseUrl: CLOUD_CONFIG.url,
            supabaseKey: CLOUD_CONFIG.key
        },
        departments: [
            { id: "dept_0", name: "الإدارة العامة (أقسام مباشرة)", sections: ["قسم الجودة التقنية"] },
            { id: "dept_1", name: "إدارة الأنظمة والبرامج", sections: ["قسم تطور الأنظمة والبرامج", "قسم الاختبار وجودة الأنظمة والبرامج"] },
            { id: "dept_2", name: "إدارة الدعم الفني", sections: ["قسم خدمات المستفيدين", "قسم الصيانة والتشغيل", "قسم التمويل الفني"] },
            { id: "dept_3", name: "إدارة البنية التحتية", sections: ["قسم الشبكات", "قسم الحوسبة السحابية ومركز البيانات", "قسم المخاطر واستمرارية الأعمال", "قسم أمن وحماية البنية التحتية"] },
            { id: "dept_4", name: "إدارة التحول الرقمي", sections: ["قسم تحليل الأعمال", "قسم تمكين التحول الرقمي", "قسم الإبتكار والذكاء الاصطناعي"] },
            { id: "dept_5", name: "إدارة التخطيط التقني", sections: ["قسم التخطيط والدراسات", "قسم البنية المؤسسية", "مكتب إدارة المشاريع"] }
        ],
        users: [
            {
                id: "usr_admin",
                name: "مدير النظام التقني (Super Admin)",
                username: "admin",
                password: "Hh@537573",
                role: "super_admin",
                empId: "ADM001",
                jobTitle: "مشرف النظام التقني العام",
                deptId: "dept_0",
                sectionName: "",
                signatureData: "",
                mustChangePass: false
            },
            {
                id: "usr_halshuhiyb",
                name: "حسين الشهيب",
                username: "halshuhiyb",
                password: "Hh@537573",
                role: "super_admin",
                empId: "EMP001",
                jobTitle: "مدير عام تقنية المعلومات والتحول الرقمي",
                deptId: "dept_0",
                sectionName: "",
                signatureData: "",
                mustChangePass: false
            }
        ],
        requests: [],
        delegations: [],
        resetRequests: []
    };

    const App = {
        db: DB_DEFAULT,
        currentUser: null,
        activeTab: "dashboard",
        supabaseClient: null,

        async init() {
            this.loadDB();
            this.initSupabase();
            await this.pullFromCloud(false);
            this.checkSession();
        },

        loadDB() {
            const raw = localStorage.getItem("LEAVE_SYS_DATA_V8") || localStorage.getItem("LEAVE_SYS_DATA_V7") || localStorage.getItem("LEAVE_SYS_DATA");
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    this.db = Object.assign({}, DB_DEFAULT, parsed);
                } catch(e) {
                    console.error("Local parse error", e);
                }
            } else {
                this.db = JSON.parse(JSON.stringify(DB_DEFAULT));
            }
            this.db.settings.supabaseUrl = CLOUD_CONFIG.url;
            this.db.settings.supabaseKey = CLOUD_CONFIG.key;
            this.saveDB(false);
        },

        saveDB(syncToCloud = true) {
            localStorage.setItem("LEAVE_SYS_DATA_V8", JSON.stringify(this.db));
            this.updateHeaderUI();
            if (syncToCloud && this.supabaseClient) {
                this.pushToCloud(false);
            }
        },

        initSupabase() {
            const badge = document.getElementById("cloudStatusBadge");
            if (window.supabase) {
                try {
                    this.supabaseClient = window.supabase.createClient(CLOUD_CONFIG.url, CLOUD_CONFIG.key);
                    if (badge) {
                        badge.className = "text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500 text-white border border-white/20";
                        badge.innerHTML = `سحابي متصل (Supabase)`;
                    }
                } catch (e) {
                    console.warn("Supabase init err:", e);
                }
            }
        },

        async pushToCloud(showAlert = true) {
            if (!this.supabaseClient) return false;
            try {
                const { error } = await this.supabaseClient.from("app_state").upsert({
                    id: 1,
                    payload: this.db,
                    updated_at: new Date().toISOString()
                });
                if (error) throw error;
                if (showAlert) alert("✅ تم رفع وحفظ كافة بيانات النظام إلى قاعدة بيانات Supabase بنجاح!");
                return true;
            } catch (err) {
                if (showAlert) alert("❌ فشل الرفع للسحابة:\n" + err.message);
                return false;
            }
        },

        async pullFromCloud(showAlert = true) {
            if (!this.supabaseClient) return false;
            try {
                const { data, error } = await this.supabaseClient.from("app_state").select("payload").eq("id", 1).maybeSingle();
                if (error) throw error;
                if (data && data.payload) {
                    this.db = Object.assign({}, DB_DEFAULT, data.payload);
                    this.db.settings.supabaseUrl = CLOUD_CONFIG.url;
                    this.db.settings.supabaseKey = CLOUD_CONFIG.key;
                    this.saveDB(false);
                    this.updateHeaderUI();
                    if (showAlert) {
                        alert("✅ تم استرجاع وتحديث كافة البيانات من السحابة بنجاح!");
                        if (this.currentUser) this.setTab(this.activeTab);
                    }
                    return true;
                }
            } catch (err) {
                console.warn("Cloud pull note:", err);
            }
            return false;
        },

        // فحص واختبار الاتصال بالسحابة
        async testCloudConnection() {
            const resultBox = document.getElementById("connectionTestResult");
            if (!resultBox) return;
            resultBox.classList.remove("hidden");
            resultBox.innerHTML = `<div class="p-3 bg-blue-50 border border-blue-200 text-blue-800 rounded-xl flex items-center gap-2"><svg class="w-4 h-4 animate-spin text-blue-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg><span>جاري فحص الاتصال بقاعدة بيانات Supabase واختبار الجداول...</span></div>`;

            try {
                const start = performance.now();
                const { data, error } = await this.supabaseClient.from("app_state").select("id, updated_at").eq("id", 1);
                const latency = Math.round(performance.now() - start);
                if (error) throw error;

                resultBox.innerHTML = `
                    <div class="p-4 bg-emerald-50 border border-emerald-300 text-emerald-900 rounded-xl space-y-2">
                        <div class="flex items-center gap-2 font-black text-sm text-emerald-800">
                            <span>✅ الاتصال السحابي سليم 100% وجاهز للعمل!</span>
                        </div>
                        <div class="text-xs space-y-1 font-mono text-emerald-700">
                            <p>• سرعة الاستجابة (Latency): <strong>${latency}ms</strong></p>
                            <p>• جدول المزامنة (app_state): <strong>متصل ومتاح للقراءة والكتابة</strong></p>
                            <p>• السجلات السحابية: <strong>${data && data.length > 0 ? 'يوجد سجل مزامنة نشط' : 'الجدول جاهز'}</strong></p>
                        </div>
                    </div>
                `;
            } catch (err) {
                resultBox.innerHTML = `
                    <div class="p-4 bg-red-50 border border-red-300 text-red-900 rounded-xl space-y-2 text-xs">
                        <div class="font-bold flex items-center gap-2 text-red-700 text-sm">
                            <span>❌ فشل الاتصال بقاعدة البيانات</span>
                        </div>
                        <p class="font-mono bg-white p-2 rounded border border-red-200">${err.message}</p>
                    </div>
                `;
            }
        },

        checkSession() {
            const uid = sessionStorage.getItem("LEAVE_ACTIVE_UID");
            if (uid) {
                const user = this.db.users.find(u => u.id === uid);
                if (user) {
                    this.setCurrentUser(user);
                    return;
                }
            }
            this.renderLoginView();
        },

        setCurrentUser(user) {
            this.currentUser = user;
            sessionStorage.setItem("LEAVE_ACTIVE_UID", user.id);
            this.updateHeaderUI();

            document.getElementById("userHeaderPanel").classList.remove("hidden");
            document.getElementById("navTabsContainer").classList.remove("hidden");
            document.getElementById("headerUserName").innerText = user.name;
            document.getElementById("headerUserRole").innerText = `${user.jobTitle} - ${this.getRoleTitle(user.role)}`;
            document.getElementById("userAvatarText").innerText = user.name.charAt(0);

            this.renderTabs();
            this.setTab('dashboard');
        },

        logout() {
            sessionStorage.removeItem("LEAVE_ACTIVE_UID");
            this.currentUser = null;
            document.getElementById("userHeaderPanel").classList.add("hidden");
            document.getElementById("navTabsContainer").classList.add("hidden");
            this.renderLoginView();
        },

        updateHeaderUI() {
            const topTitle = document.getElementById("topOrgTitle");
            if (topTitle) topTitle.innerText = this.db.settings.generalDept || "الإدارة العامة لتقنية المعلومات والتحول الرقمي";
            const logoCont = document.getElementById("orgLogoContainer");
            if (logoCont) {
                if (this.db.settings.logoData) {
                    logoCont.innerHTML = `<img src="${this.db.settings.logoData}" class="w-full h-full object-contain" alt="Logo">`;
                }
            }
        },

        getRoleTitle(role) {
            const map = {
                super_admin: "مدير النظام (Super Admin)",
                gen_manager: "المدير العام",
                dept_manager: "مدير إدارة",
                section_head: "رئيس قسم",
                employee: "موظف"
            };
            return map[role] || "موظف";
        },

        renderTabs() {
            const list = document.getElementById("tabsList");
            const r = this.currentUser ? this.currentUser.role : "";
            const isManager = ['super_admin', 'gen_manager', 'dept_manager', 'section_head'].includes(r);
            const isSuper = r === 'super_admin';

            let tabs = [
                { id: 'dashboard', label: 'الرئيسية (الإحصاءات)', icon: Icons.dashboard },
                { id: 'my_requests', label: 'استئذاناتي', icon: Icons.requests }
            ];

            if (isManager) {
                tabs.push({ id: 'approvals', label: 'صندوق الاعتمادات', icon: Icons.approvals });
                tabs.push({ id: 'delegations', label: 'التفويض الإداري', icon: Icons.delegations });
            }

            tabs.push({ id: 'reports', label: 'التقارير والإحصائيات (كشف حصر)', icon: Icons.reports });

            if (isSuper) {
                tabs.push({ id: 'admin_users', label: 'إدارة الموظفين والصلاحيات', icon: Icons.users });
                tabs.push({ id: 'admin_resets', label: 'طلبات استعادة الكلمات', icon: Icons.resets });
                tabs.push({ id: 'settings', label: 'إعدادات النظام والدوام', icon: Icons.settings });
            }

            list.innerHTML = tabs.map(t => `
                <button onclick="App.setTab('${t.id}')"

                this.renderSettingsView(container);
            } else if (tabId === 'admin_users') {
                this.renderAdminUsersView(container);

                this.renderAdminResetsView(container);
            } else if (tabId === 'approvals') {
                this.renderApprovalsView(container);
            } else if (tabId === 'delegations') {
                this.renderDelegationsView(container);
            } else if (tabId === 'reports') {

                            </button>

                    </div>

                                <label class="block font-bold text-slate-700 mb-1">الفترة من تاريخ</label>

                                <label class="block font-bold text-slate-700 mb-1">إلى تاريخ</label>

                                <select id="repFilterStatus" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                                    <option value="ALL">جميع الحالات (معتمد / قيد الانتظار / مرفوض)</option>
                                    <option value="approved" selected>الاستئذانات المعتمدة فقط</option>
                                    <option value="pending">قيد الانتظار</option>
                                    <option value="rejected">المرفوضة</option>
                                </select>
                            </div>

                            ${isManager ? `

                                <p class="text-xs font-black text-slate-700">${this.db.settings.reportHeaderTitle || 'كشف حصر ومتابعة الاستئذانات الإدارية (الإجمالي السردي)'}</p>
                            </div>

        applyReportFilter() {
            const from = document.getElementById("repFilterFrom")?.value;
            const to = document.getElementById("repFilterTo")?.value;
            const status = document.getElementById("repFilterStatus")?.value || 'ALL';
            const isManager = ['super_admin', 'gen_manager', 'dept_manager', 'section_head'].includes(this.currentUser.role);
            const userFilter = isManager ? (document.getElementById("repFilterUser")?.value || 'ALL') : this.currentUser.id;

            let list = this.db.requests;

            if (this.currentUser.role === 'employee') {
                list = list.filter(r => r.userId === this.currentUser.id);
            } else if (this.currentUser.role === 'dept_manager') {
                if (userFilter === 'ALL') {
                    list = list.filter(r => r.deptId === this.currentUser.deptId);
                } else {
                    list = list.filter(r => r.userId === userFilter);
                }
            } else if (this.currentUser.role === 'section_head') {
                if (userFilter === 'ALL') {
                    list = list.filter(r => r.sectionName === this.currentUser.sectionName);
                } else {
                    list = list.filter(r => r.userId === userFilter);
                }
            } else if (['super_admin', 'gen_manager'].includes(this.currentUser.role)) {
                if (userFilter !== 'ALL') {
                    list = list.filter(r => r.userId === userFilter);
                }
            }

            if (from) list = list.filter(r => r.leaveDate >= from);
            if (to) list = list.filter(r => r.leaveDate <= to);
            if (status !== 'ALL') list = list.filter(r => r.status === status);

            const approvedCount = list.filter(r => r.status === 'approved').length;
            const totalHours = list.filter(r => r.status === 'approved').reduce((acc, curr) => acc + (parseFloat(curr.hours) || 0), 0);
            const pendingCount = list.filter(r => r.status === 'pending').length;
            const rejectedCount = list.filter(r => r.status === 'rejected').length;

            const metricsBox = document.getElementById("reportQuickMetrics");
            if (metricsBox) {
                metricsBox.innerHTML = `
                    <div class="p-2.5 bg-white rounded-lg border border-slate-200">إجمالي العمليات المسجلة: <span class="font-black text-slate-900 block text-base">${list.length}</span></div>
                    <div class="p-2.5 bg-white rounded-lg border border-slate-200">الاستئذانات المعتمدة: <span class="font-black text-emerald-700 block text-base">${approvedCount} (${totalHours.toFixed(1)} س)</span></div>
                    <div class="p-2.5 bg-white rounded-lg border border-slate-200">قيد الانتظار: <span class="font-black text-amber-600 block text-base">${pendingCount}</span></div>
                    <div class="p-2.5 bg-white rounded-lg border border-slate-200">المرفوضة: <span class="font-black text-red-600 block text-base">${rejectedCount}</span></div>
                `;
            }

            const tableBox = document.getElementById("reportTableContainer");
            if (tableBox) {
                if (list.length === 0) {
                    tableBox.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs font-semibold">لا توجد سجلات استئذان مطابقة لشروط الفلترة المحددة في هذا الكشف.</div>`;
                } else {
                    tableBox.innerHTML = `
                        <table class="w-full text-right text-xs border-collapse border border-slate-300">
                            <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-300">
                                <tr>
                                    <th class="p-2.5 border border-slate-300 text-center w-12">م</th>
                                    <th class="p-2.5 border border-slate-300">رقم الطلب</th>
                                    <th class="p-2.5 border border-slate-300">اسم الموظف</th>
                                    <th class="p-2.5 border border-slate-300">الرقم الوظيفي</th>
                                    <th class="p-2.5 border border-slate-300">الإدارة / القسم</th>
                                    <th class="p-2.5 border border-slate-300">نوع الاستئذان</th>
                                    <th class="p-2.5 border border-slate-300 text-center">التاريخ</th>
                                    <th class="p-2.5 border border-slate-300">الوقت والمدة</th>
                                    <th class="p-2.5 border border-slate-300 text-center">الساعات</th>

        // --- 4. طباعة القرار الرسمي الفردي المعزول ---

            let signatureImgSrc = req.decisionSign || "";
            if (!signatureImgSrc) {
                const approverUser = this.db.users.find(u => u.name === cleanApproverName || u.id === req.decisionById);

                    signatureImgSrc = approverUser.signatureData;
                }
            }

            printBox.innerHTML = `
                <div style="background-color: #ffffff; border: 2px solid #1e293b; border-radius: 16px; padding: 30px; width: 100%; max-width: 780px; margin: 0 auto; box-sizing: border-box; color: #0f172a;">

                            ${this.db.settings.logoData ? `<img src="${this.db.settings.logoData}" style="max-height: 100%; max-width: 100%; object-fit: contain;">` : `<svg style="width: 35px; height: 35px; color: #334155;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>`}

                        </div>
                    </div>

                        </div>

                        <div style="text-align: center;">
                            <p style="font-size: 11px; font-weight: bold; color: #64748b; margin: 0 0 4px 0;">المعتمد:</p>

                            <div style="height: 55px; min-width: 130px; display: flex; align-items: center; justify-content: center; margin: 2px 0;">

                            </div>
                            <p style="font-size: 10px; color: #94a3b8; font-family: monospace; margin: 4px 0 0 0;">التاريخ: ${req.decisionDate || req.leaveDate}</p>
                        </div>
                    </div>
                </div>
            `;

            printBox.classList.remove("hidden");

            const qrTarget = document.getElementById("printQrCode");
            if (qrTarget) {
                qrTarget.innerHTML = "";
                new QRCode(qrTarget, {
                    text: `LEAVE-AUTH:${req.refNo}|${req.userName}|${req.leaveDate}|APPROVED`,
                    width: 85,
                    height: 85,
                    correctLevel: QRCode.CorrectLevel.M
                });
            }

            document.body.classList.remove("print-mode-report");
            document.body.classList.add("print-mode-resolution");

            setTimeout(() => {
                window.print();
                printBox.classList.add("hidden");
                document.body.classList.remove("print-mode-resolution");

        // --- 5. الإعدادات والدوام وفحص الاتصال بالسحابة ---

        handleLogoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                App.db.settings.logoData = evt.target.result;
                App.saveDB();
                App.setTab("settings");
            };
            reader.readAsDataURL(file);
        },

        removeLogo() {
            if (confirm("هل تريد العودة للشعار الافتراضي؟")) {
                this.db.settings.logoData = "";
                this.saveDB();
                this.setTab("settings");
            }
        },

        saveGeneralSettings() {
            this.db.settings.generalDept = document.getElementById("setGenDept").value.trim();
            this.db.settings.reportHeaderTitle = document.getElementById("setReportTitle")?.value.trim() || "كشف حصر ومتابعة الاستئذانات الإدارية (الإجمالي السردي)";
            this.saveDB();
            alert("تم حفظ بيانات المنشأة وعناوين التقارير بنجاح.");
        },

        saveWorkTimes() {
            this.db.settings.workStartTime = document.getElementById("setWorkStart").value;
            this.db.settings.workEndTime = document.getElementById("setWorkEnd").value;
            this.saveDB();
            alert("تم حفظ مواعيد الدوام الرسمي وسيعتمدها النظام تلقائياً.");
        },

        openAddDepartmentPrompt() {
            const name = prompt("أدخل مسمى الإدارة الجديدة:");
            if (name && name.trim()) {
                this.db.departments.push({
                    id: "dept_" + Date.now(),
                    name: name.trim(),
                    sections: []
                });
                this.saveDB();
                this.setTab("settings");
            }
        },

        renameDept(deptId) {
            const dept = this.db.departments.find(d => d.id === deptId);
            if (!dept) return;
            const newName = prompt("أدخل المسمى الجديد للإدارة:", dept.name);
            if (newName && newName.trim() && newName.trim() !== dept.name) {
                dept.name = newName.trim();
                this.saveDB();
                this.setTab("settings");
            }
        },

        safeDeleteDept(deptId) {
            const count = this.db.users.filter(u => u.deptId === deptId).length;
            if (count > 0) {
                alert(`⚠️ تعذر الحذف!\n\nهناك (${count}) موظف مسجلون تحت هذه الإدارة حالياً.`);
                return;
            }
            if (confirm("هل أنت متأكد من حذف هذه الإدارة؟")) {
                this.db.departments = this.db.departments.filter(d => d.id !== deptId);
                this.saveDB();
                this.setTab("settings");
            }
        },

        addSectionToDept(deptId) {
            const dept = this.db.departments.find(d => d.id === deptId);
            if (!dept) return;
            const sec = prompt(`أدخل اسم القسم التابع لـ (${dept.name}):`);
            if (sec && sec.trim()) {
                if (!dept.sections) dept.sections = [];
                dept.sections.push(sec.trim());
                this.saveDB();
                this.setTab("settings");
            }
        },

        renameSection(deptId, oldSec) {
            const dept = this.db.departments.find(d => d.id === deptId);
            if (!dept) return;
            const newSec = prompt("أدخل اسم القسم الجديد:", oldSec);
            if (newSec && newSec.trim() && newSec.trim() !== oldSec) {
                const idx = dept.sections.indexOf(oldSec);
                if (idx !== -1) dept.sections[idx] = newSec.trim();
                this.db.users.forEach(u => {
                    if (u.deptId === deptId && u.sectionName === oldSec) u.sectionName = newSec.trim();
                });
                this.saveDB();
                this.setTab("settings");
            }
        },

        safeDeleteSection(deptId, secName) {
            const count = this.db.users.filter(u => u.deptId === deptId && u.sectionName === secName).length;
            if (count > 0) {
                alert(`⚠️ لا يمكن حذف القسم!\n\nيوجد (${count}) موظف مسجلون في هذا القسم.`);
                return;
            }
            if (confirm(`هل أنت متأكد من حذف قسم (${secName})؟`)) {
                const dept = this.db.departments.find(d => d.id === deptId);
                if (dept && dept.sections) {
                    dept.sections = dept.sections.filter(s => s !== secName);
                    this.saveDB();
                    this.setTab("settings");
                }
            }

            switch(s) {

                case 'approved': return `<span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-bold">معتمد ومقبول</span>`;
                case 'rejected': return `<span class="bg-red-100 text-red-800 px-2.5 py-0.5 rounded-full font-bold">مرفوض</span>`;
                default: return s;

        },

        openNewRequestModal() {
            const today = new Date().toISOString().split("T")[0];
            const mc = document.getElementById("modalContent");
            mc.innerHTML = `
                <div class="flex justify-between items-center pb-3 border-b mb-4">

        handleRequestTypeChange() {
            const type = document.getElementById("reqType").value;
            const container = document.getElementById("dynamicTimingContainer");
            const startD = this.db.settings.workStartTime || "07:30";
            const endD = this.db.settings.workEndTime || "14:30";

            if (type === 'late_in') {
                container.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs text-slate-500 font-bold">
                            <span>بداية الدوام الرسمي: ${startD}</span>
                        </div>
                        <label class="block text-xs font-bold text-slate-700">وقت الحضور المتوقع</label>
                        <input type="time" id="reqTimeIn" required value="09:00" class="w-full p-2 bg-white border rounded-lg text-xs font-bold font-mono">
                    </div>
                `;
            } else if (type === 'early_out') {
                container.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs text-slate-500 font-bold">
                            <span>نهاية الدوام الرسمي: ${endD}</span>
                        </div>
                        <label class="block text-xs font-bold text-slate-700">وقت الخروج</label>
                        <input type="time" id="reqTimeOut" required value="12:30" class="w-full p-2 bg-white border rounded-lg text-xs font-bold font-mono">
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">وقت بداية الخروج</label>
                            <input type="time" id="reqTimeStart" required value="10:00" class="w-full p-2 bg-white border rounded-lg text-xs font-bold font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">وقت العودة المتوقع</label>
                            <input type="time" id="reqTimeReturn" required value="12:00" class="w-full p-2 bg-white border rounded-lg text-xs font-bold font-mono">
                        </div>
                    </div>
                `;
            }
        },

        handleSaveRequest(e) {
            e.preventDefault();
            const type = document.getElementById("reqType").value;
            const leaveDate = document.getElementById("reqLeaveDate").value;
            const reason = document.getElementById("reqReason").value.trim();
            const startD = this.db.settings.workStartTime || "07:30";
            const endD = this.db.settings.workEndTime || "14:30";

            let timingText = "";
            let hours = 0;

            if (type === 'late_in') {
                const timeIn = document.getElementById("reqTimeIn").value;
                timingText = `حضور الساعة ${timeIn}`;
                hours = this.calcHoursDiff(startD, timeIn);
            } else if (type === 'early_out') {
                const timeOut = document.getElementById("reqTimeOut").value;
                timingText = `خروج الساعة ${timeOut}`;
                hours = this.calcHoursDiff(timeOut, endD);
            } else {
                const t1 = document.getElementById("reqTimeStart").value;
                const t2 = document.getElementById("reqTimeReturn").value;
                timingText = `من ${t1} إلى ${t2}`;
                hours = this.calcHoursDiff(t1, t2);
            }

            if (hours <= 0) hours = 0.5;

            const newReq = {
                id: "req_" + Date.now(),
                refNo: "REQ-" + new Date().getFullYear() + "-" + String(this.db.requests.length + 1).padStart(3, '0'),
                userId: this.currentUser.id,
                userName: this.currentUser.name,
                empId: this.currentUser.empId,
                jobTitle: this.currentUser.jobTitle,
                deptId: this.currentUser.deptId,
                sectionName: this.currentUser.sectionName,
                applyDate: new Date().toISOString().split("T")[0],
                leaveDate: leaveDate,
                type: type,
                timingText: timingText,
                hours: hours,
                reason: reason,
                status: "pending",
                decisionBy: "",
                decisionById: "",
                decisionDate: "",
                decisionSign: "",
                rejectReason: ""
            };

            this.db.requests.unshift(newReq);
            this.saveDB();
            this.closeModal();
            this.setTab("my_requests");
            alert("تم رفع طلب الاستئذان بنجاح وبانتظار الاعتماد.");
        },

        calcHoursDiff(start, end) {
            const [h1, m1] = start.split(":").map(Number);
            const [h2, m2] = end.split(":").map(Number);
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff < 0) diff = 0;
            return parseFloat((diff / 60).toFixed(1));
        },

        deleteRequest(id) {
            if (confirm("هل تريد إلغاء هذا الطلب؟")) {
                this.db.requests = this.db.requests.filter(x => x.id !== id);
                this.saveDB();
                this.setTab("my_requests");
            }
        },

        openApproveDecisionModal(reqId, isApprove) {

            const mc = document.getElementById("modalContent");

                req.rejectReason = reason;

            req.decisionBy = this.currentUser.name;

            req.decisionSign = this.currentUser.signatureData || "";

                                    <td class="p-3.5 font-bold text-emerald-800">${d.toUserName}</td>
                                    <td class="p-3.5 font-mono">${d.startDate}</td>
                                    <td class="p-3.5 font-mono">${d.endDate}</td>
                                    <td class="p-3.5 text-slate-500">${d.reason}</td>
                                    <td class="p-3.5 text-center">
                                        <button onclick="App.deleteDelegation('${d.id}')" class="text-red-600 hover:bg-red-50 p-1 rounded font-bold">
                                            إلغاء
                                        </button>
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            `;
        },

        openNewDelegationModal() {
            const users = this.db.users.filter(u => u.id !== this.currentUser.id);
            const today = new Date().toISOString().split("T")[0];
            const mc = document.getElementById("modalContent");
            mc.innerHTML = `
                <div class="flex justify-between items-center pb-3 border-b mb-4">
                    <h3 class="font-black text-sm">تسجيل تفويض إداري جديد</h3>
                    <button onclick="App.closeModal()">✕</button>
                </div>
                <form onsubmit="App.handleSaveDelegation(event)" class="space-y-4 text-right">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">الموظف / المدير المفوّض له</label>
                        <select id="delUserTo" required class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold">
                            ${users.map(u => `<option value="${u.id}">${u.name} - ${u.jobTitle} (${this.getDeptName(u.deptId)})</option>`).join("")}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">من تاريخ</label>
                            <input type="date" id="delStart" required value="${today}" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">إلى تاريخ</label>
                            <input type="date" id="delEnd" required value="${today}" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold font-mono">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">السبب (مثلاً: تمتع بإجازة اعتيادية)</label>
                        <input type="text" id="delReason" required placeholder="قضاء إجازة..." class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold">
                    </div>
                    <div class="flex justify-end gap-2 pt-2 border-t">
                        <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">إلغاء</button>
                        <button type="submit" class="px-5 py-2 bg-emerald-700 text-white rounded-xl text-xs font-bold shadow">حفظ التفويض</button>
                    </div>
                </form>
            `;
            document.getElementById("modalContainer").classList.remove("hidden");
        },

        handleSaveDelegation(e) {
            e.preventDefault();
            const toId = document.getElementById("delUserTo").value;
            const toUser = this.db.users.find(u => u.id === toId);
            const del = {
                id: "del_" + Date.now(),
                fromUserId: this.currentUser.id,
                fromUserName: this.currentUser.name,
                toUserId: toId,
                toUserName: toUser ? toUser.name : "",
                startDate: document.getElementById("delStart").value,
                endDate: document.getElementById("delEnd").value,
                reason: document.getElementById("delReason").value
            };
            this.db.delegations.unshift(del);
            this.saveDB();
            this.closeModal();
            this.setTab("delegations");
        },

        deleteDelegation(id) {
            if (confirm("هل تريد إلغاء هذا التفويض؟")) {
                this.db.delegations = this.db.delegations.filter(d => d.id !== id);
                this.saveDB();
                this.setTab("delegations");
            }
        },

        // --- 9. إدارة الموظفين ---
        renderAdminUsersView(container) {
            container.innerHTML = `
                <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
                    <div>
                        <h2 class="text-xl font-black text-slate-800">إدارة منسوبي المنظومة والصلاحيات</h2>
                        <p class="text-xs text-slate-500 font-semibold">إضافة وتعديل بيانات الموظفين والتواقيع وإمكانية الإلحاق بالإدارة مباشرة أو بأقسامها</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="App.openTransferModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs shadow">
                            نقل موظفين بين الإدارات
                        </button>
                        <button onclick="App.openUserModal()" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold text-xs shadow">
                            + إضافة موظف جديد
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-50 text-slate-600 font-bold border-b">
                                <tr>
                                    <th class="p-3.5">الموظف والاسم</th>
                                    <th class="p-3.5">اسم الدخول والرقم</th>
                                    <th class="p-3.5">الدور / الصلاحية</th>
                                    <th class="p-3.5">الإدارة والقسم</th>
                                    <th class="p-3.5">التوقيع الإلكتروني</th>
                                    <th class="p-3.5 text-center">إجراءات</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 font-semibold text-slate-700">
                                ${this.db.users.map(u => `
                                    <tr class="hover:bg-slate-50">
                                        <td class="p-3.5 font-bold text-slate-800">${u.name}</td>
                                        <td class="p-3.5 font-mono text-emerald-800">${u.username} <span class="text-slate-400 font-sans">(${u.empId})</span></td>
                                        <td class="p-3.5">${this.getRoleTitle(u.role)}</td>
                                        <td class="p-3.5">
                                            <div class="font-bold">${this.getDeptName(u.deptId)}</div>
                                            <div class="text-[11px] text-emerald-700 font-semibold">${u.sectionName ? u.sectionName : '<span class="text-slate-400 font-normal">[تابع للإدارة مباشرة]</span>'}</div>
                                        </td>
                                        <td class="p-3.5">
                                            ${u.signatureData ? `<img src="${u.signatureData}" class="h-7 max-w-[90px] object-contain border p-0.5 rounded bg-white">` : `<span class="text-slate-300">غير مدرج</span>`}
                                        </td>
                                        <td class="p-3.5 text-center space-x-1 space-x-reverse">
                                            <button onclick="App.openUserModal('${u.id}')" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded" title="تعديل">تعديل</button>
                                            ${!['usr_admin', 'usr_halshuhiyb'].includes(u.id) ? `
                                                <button onclick="App.deleteUser('${u.id}')" class="p-1.5 text-red-600 hover:bg-red-50 rounded" title="حذف">حذف</button>
                                            ` : ''}
                                        </td>
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        },

        openUserModal(userId = null) {
            const user = userId ? this.db.users.find(u => u.id === userId) : null;
            const mc = document.getElementById("modalContent");
            const tempPass = "temp" + Math.floor(1000 + Math.random() * 9000);

            mc.innerHTML = `
                <div class="flex justify-between items-center pb-3 border-b mb-4">
                    <h3 class="font-black text-sm">${user ? 'تعديل بيانات موظف' : 'إضافة موظف جديد للمنظومة'}</h3>
                    <button onclick="App.closeModal()">✕</button>
                </div>

                <form onsubmit="App.handleSaveUser(event, '${userId || ''}')" class="space-y-3.5 text-right">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">الاسم الكامل *</label>
                        <input type="text" id="uName" required value="${user ? user.name : ''}" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-bold">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">الرقم الوظيفي *</label>
                            <input type="text" id="uEmpId" required value="${user ? user.empId : 'EMP' + Math.floor(100 + Math.random()*900)}" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-bold font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم *</label>
                            <input type="text" id="uUsername" required value="${user ? user.username : ''}" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-bold font-mono">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">الصلاحية في النظام *</label>
                            <select id="uRole" required class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-bold">
                                <option value="employee" ${user && user.role === 'employee' ? 'selected' : ''}>موظف عادي</option>
                                <option value="section_head" ${user && user.role === 'section_head' ? 'selected' : ''}>رئيس قسم</option>
                                <option value="dept_manager" ${user && user.role === 'dept_manager' ? 'selected' : ''}>مدير إدارة</option>
                                <option value="gen_manager" ${user && user.role === 'gen_manager' ? 'selected' : ''}>المدير العام</option>
                                <option value="super_admin" ${user && user.role === 'super_admin' ? 'selected' : ''}>مدير النظام (Super Admin)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">المسمى الوظيفي *</label>
                            <input type="text" id="uJobTitle" required value="${user ? user.jobTitle : 'أخصائي تقني'}" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-bold">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">الإدارة التابع لها *</label>
                            <select id="uDeptId" onchange="App.handleUserModalDeptChange()" required class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-bold">
                                ${this.db.departments.map(d => `<option value="${d.id}" ${user && user.deptId === d.id ? 'selected' : ''}>${d.name}</option>`).join("")}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">القسم (اختياري)</label>
                            <select id="uSectionName" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-bold"></select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                        <input type="password" id="uPassword" required value="${user ? user.password : tempPass}" class="w-full p-2 bg-slate-50 border rounded-xl text-xs font-bold font-mono">
                    </div>

                    <div class="p-3 bg-slate-50 border rounded-xl">
                        <label class="block text-xs font-bold text-slate-700 mb-1">صورة التوقيع الإلكتروني (PNG/JPG)</label>
                        <input type="file" id="uSignFile" accept="image/*" onchange="App.handleSignatureUpload(event)" class="text-xs w-full">
                        <input type="hidden" id="uSignatureData" value="${user ? (user.signatureData || '') : ''}">
                    </div>

                    <div class="flex justify-end gap-2 pt-3 border-t">
                        <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">إلغاء</button>
                        <button type="submit" class="px-5 py-2 bg-emerald-700 text-white rounded-xl text-xs font-bold shadow">حفظ البيانات</button>
                    </div>
                </form>
            `;
            document.getElementById("modalContainer").classList.remove("hidden");
            this.handleUserModalDeptChange(user ? user.sectionName : null);
        },

        handleUserModalDeptChange(selectedSection = null) {
            const deptId = document.getElementById("uDeptId").value;
            const secSelect = document.getElementById("uSectionName");
            const dept = this.db.departments.find(d => d.id === deptId);

            let optionsHtml = `<option value="">[بدون قسم - تابع للإدارة مباشرة]</option>`;
            if (dept && dept.sections && dept.sections.length > 0) {
                dept.sections.forEach(s => {
                    optionsHtml += `<option value="${s}" ${selectedSection === s ? 'selected' : ''}>${s}</option>`;
                });
            }
            secSelect.innerHTML = optionsHtml;
        },

        handleSignatureUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                document.getElementById("uSignatureData").value = evt.target.result;
            };
            reader.readAsDataURL(file);
        },

        handleSaveUser(e, userId) {
            e.preventDefault();
            const isEdit = Boolean(userId);
            const userObj = {
                id: isEdit ? userId : ("usr_" + Date.now()),
                name: document.getElementById("uName").value.trim(),
                empId: document.getElementById("uEmpId").value.trim(),
                username: document.getElementById("uUsername").value.trim(),
                role: document.getElementById("uRole").value,
                jobTitle: document.getElementById("uJobTitle").value.trim(),
                deptId: document.getElementById("uDeptId").value,
                sectionName: document.getElementById("uSectionName").value.trim(),
                password: document.getElementById("uPassword").value,
                signatureData: document.getElementById("uSignatureData").value,
                mustChangePass: false
            };

            if (isEdit) {
                const idx = this.db.users.findIndex(u => u.id === userId);
                if (idx !== -1) this.db.users[idx] = Object.assign({}, this.db.users[idx], userObj);
            } else {
                this.db.users.push(userObj);
            }

            this.saveDB();
            this.closeModal();
            this.setTab("admin_users");
            alert("تم حفظ بيانات الموظف بنجاح.");
        },

        deleteUser(userId) {
            if (confirm("هل تريد حذف هذا الموظف؟")) {
                this.db.users = this.db.users.filter(u => u.id !== userId);
                this.saveDB();
                this.setTab("admin_users");
            }
        },

        openTransferModal() {
            const mc = document.getElementById("modalContent");
            mc.innerHTML = `
                <div class="flex justify-between items-center pb-3 border-b mb-4">
                    <h3 class="font-black text-sm">نقل موظف بين الإدارات والأقسام</h3>
                    <button onclick="App.closeModal()">✕</button>
                </div>
                <form onsubmit="App.handleExecuteTransfer(event)" class="space-y-4 text-right">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">اختر الموظف</label>
                        <select id="transferEmpId" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold">
                            ${this.db.users.map(u => `<option value="${u.id}">${u.name} (${this.getDeptName(u.deptId)} - ${u.sectionName || 'تابع للإدارة مباشرة'})</option>`).join("")}
                        </select>
                    </div>

                    <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">الإدارة الجديدة</label>
                            <select id="newTransferDeptId" onchange="App.handleTransferDeptChange()" class="w-full p-2 bg-white border rounded-lg text-xs font-bold">
                                ${this.db.departments.map(d => `<option value="${d.id}">${d.name}</option>`).join("")}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">القسم الجديد</label>
                            <select id="newTransferSection" class="w-full p-2 bg-white border rounded-lg text-xs font-bold"></select>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-2 border-t">
                        <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold">إلغاء</button>
                        <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow">تأكيد ونقل</button>
                    </div>
                </form>
            `;
            document.getElementById("modalContainer").classList.remove("hidden");
            this.handleTransferDeptChange();
        },

        handleTransferDeptChange() {
            const deptId = document.getElementById("newTransferDeptId").value;
            const secSel = document.getElementById("newTransferSection");
            const dept = this.db.departments.find(d => d.id === deptId);

            let options = `<option value="">[بدون قسم - تابع للإدارة مباشرة]</option>`;
            if (dept && dept.sections && dept.sections.length > 0) {
                dept.sections.forEach(s => {
                    options += `<option value="${s}">${s}</option>`;
                });
            }
            secSel.innerHTML = options;
        },

        handleExecuteTransfer(e) {
            e.preventDefault();
            const uId = document.getElementById("transferEmpId").value;
            const newDept = document.getElementById("newTransferDeptId").value;
            const newSec = document.getElementById("newTransferSection").value.trim();

            const u = this.db.users.find(x => x.id === uId);
            if (u) {
                u.deptId = newDept;
                u.sectionName = newSec;
                this.saveDB();
                this.closeModal();
                this.setTab("admin_users");
                alert(`تم نقل الموظف (${u.name}) بنجاح.`);
            }
        },

        // --- 10. طلبات استعادة الكلمات ---
        renderAdminResetsView(container) {
            container.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-xl font-black text-slate-800">طلبات استعادة وإعادة ضبط كلمات المرور</h2>
                    <p class="text-xs text-slate-500 font-semibold">متابعة الموظفين الذين نسوا كلمات المرور وتوليد كلمات مرور مؤقتة لهم</p>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-right text-xs">
                        <thead class="bg-slate-50 text-slate-600 font-bold border-b">
                            <tr>
                                <th class="p-3.5">اسم الموظف</th>
                                <th class="p-3.5">اسم المستخدم</th>
                                <th class="p-3.5">تاريخ الطلب</th>
                                <th class="p-3.5">الحالة</th>
                                <th class="p-3.5 text-center">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 font-semibold text-slate-700">
                            ${this.db.resetRequests.length === 0 ? `
                                <tr><td colspan="5" class="p-8 text-center text-slate-400">لا توجد طلبات استعادة معلقة</td></tr>
                            ` : this.db.resetRequests.map(r => `
                                <tr>
                                    <td class="p-3.5 font-bold">${r.name}</td>
                                    <td class="p-3.5 font-mono text-emerald-800">${r.username}</td>
                                    <td class="p-3.5 font-mono">${r.requestDate}</td>
                                    <td class="p-3.5">${r.status === 'pending' ? '<span class="bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full font-bold">بانتظار الضبط</span>' : '<span class="bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full font-bold">تم الضبط</span>'}</td>
                                    <td class="p-3.5 text-center">
                                        ${r.status === 'pending' ? `
                                            <button onclick="App.processPasswordReset('${r.id}')" class="px-3 py-1 bg-emerald-700 text-white rounded-lg font-bold text-xs shadow">
                                                توليد كلمة سر
                                            </button>
                                        ` : '<span class="text-slate-400">مكتمل</span>'}
                                    </td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            `;
        },

        processPasswordReset(reqId) {
            const req = this.db.resetRequests.find(r => r.id === reqId);
            if (!req) return;
            const user = this.db.users.find(u => u.id === req.userId);
            if (!user) return;

            const tempPass = "pass" + Math.floor(1000 + Math.random() * 9000);
            user.password = tempPass;
            req.status = "completed";
            this.saveDB();
            this.setTab("admin_resets");
            alert(`تم توليد كلمة مرور مؤقتة للموظف (${user.name}):\n\nكلمة المرور: ${tempPass}`);
        },

        getDeptName(id) {
            const d = this.db.departments.find(x => x.id === id);
            return d ? d.name : "الإدارة العامة";
        },

        closeModal() {
            document.getElementById("modalContainer").classList.add("hidden");
        }
    };

    window.addEventListener("DOMContentLoaded", () => {
        App.init();
    });
    </script>
</body>
</html>
