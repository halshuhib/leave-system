                                    <input type="text" id="user-fullname" required placeholder="مثال: تركي بن فيصل الحربي" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold" />
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">الرقم الوظيفي <span class="text-rose-500">*</span></label>
                                    <input type="text" id="user-empid" required placeholder="مثال: EMP099" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold font-mono" />
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">اسم المستخدم للدخول <span class="text-rose-500">*</span></label>
                                    <input type="text" id="user-uname" required placeholder="مثال: turki_h" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold font-mono" />
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">الدور والصلاحية <span class="text-rose-500">*</span></label>
                                    <select id="user-role" required class="w-full p-2.5 bg-white border border-slate-300 rounded-xl font-bold">
                                        <option value="employee">موظف عادي</option>
                                        <option value="head">رئيس قسم</option>
                                        <option value="manager">مدير إدارة</option>
                                        <option value="general_manager">المدير العام</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">الإدارة التابع لها <span class="text-rose-500">*</span></label>
                                    <select id="user-dept" required onchange="App.handleUserDeptChange(this.value, 'user-section')" class="w-full p-2.5 bg-white border border-slate-300 rounded-xl font-semibold">
                                        <option value="gd-1">${structure.generalDepartment.name}</option>
                                        ${structure.departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">القسم التابع له</label>
                                    <select id="user-section" class="w-full p-2.5 bg-white border border-slate-300 rounded-xl font-semibold">
                                    </select>
                                </div>
                            </div>

                            <div class="border-t pt-3">
                                <label class="block font-bold text-slate-700 mb-1">التوقيع الإلكتروني للموظف / المدير (اختياري)</label>
                                <div class="flex items-center gap-3">
                                    <label class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl font-bold cursor-pointer transition">
                                        <i class="fa-solid fa-signature"></i> رفع صورة التوقيع
                                        <input type="file" accept="image/*" onchange="App.handleUserSignatureUpload(event, 'create-sig-preview')" class="hidden" />
                                    </label>
                                    <div id="create-sig-preview" class="h-10 w-24 border border-dashed rounded-lg bg-slate-50 flex items-center justify-center text-[10px] text-slate-400 overflow-hidden">
                                        لا يوجد توقيع
                                    </div>
                                </div>
                            </div>

                            <div class="bg-amber-50 p-3 rounded-xl border border-amber-200">
                                <label class="block font-bold text-amber-900 mb-1">كلمة المرور المؤقتة (سيتم إجباره على تغييرها فور الدخول):</label>
                                <div class="relative">
                                    <input type="text" id="user-temppass" required value="${randomTempPass}" class="w-full p-2 bg-white border border-amber-300 rounded-xl font-mono font-bold text-amber-900" />
                                </div>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-2">
                                <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-700">إلغاء</button>
                                <button type="submit" class="px-6 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold shadow">حفظ الموظف</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;

                this.handleUserDeptChange('gd-1', 'user-section');
            },

            handleUserDeptChange(deptId, secSelectId) {
                const secSelect = document.getElementById(secSelectId);
                if (!secSelect) return;

                const structure = DB.get("structure", INITIAL_STRUCTURE);
                secSelect.innerHTML = `<option value="">-- بدون قسم / إدارة مباشرة --</option>`;

                if (deptId === 'gd-1') {
                    structure.directSections.forEach(s => {
                        secSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                    });
                } else {
                    const dept = structure.departments.find(d => d.id === deptId);
                    if (dept && dept.sections) {
                        dept.sections.forEach(s => {
                            secSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                        });
                    }
                }
            },

            handleUserSignatureUpload(e, previewId) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    this.tempUserSignature = event.target.result;
                    const preview = document.getElementById(previewId);
                    if (preview) {
                        preview.innerHTML = `<img src="${this.tempUserSignature}" class="h-full w-full object-contain" />`;
                    }
                };
                reader.readAsDataURL(file);
            },

            handleSaveNewUser(e) {
                e.preventDefault();
                const fullName = document.getElementById("user-fullname").value.trim();
                const empId = document.getElementById("user-empid").value.trim();
                const uname = document.getElementById("user-uname").value.trim().toLowerCase();
                const role = document.getElementById("user-role").value;
                const deptId = document.getElementById("user-dept").value;
                const sectionId = document.getElementById("user-section").value;
                const tempPass = document.getElementById("user-temppass").value.trim();

                const users = DB.get("users", []);
                if (users.some(u => u.username.toLowerCase() === uname)) {
                    this.notify("اسم المستخدم هذا مسجل مسبقاً لموظف آخر!", "error");
                    return;
                }

                users.push({
                    id: "user-" + Date.now(),
                    empId: empId,
                    username: uname,
                    passwordHash: tempPass,
                    fullName: fullName,
                    role: role,
                    deptId: deptId,
                    sectionId: sectionId,
                    mustChangePass: true,
                    signature: this.tempUserSignature,
                    phone: "",
                    title: this.getRoleTitle(role)
                });

                DB.set("users", users);
                this.closeModal();
                this.notify(`تم إنشاء حساب الموظف (${fullName}) بنجاح`, "success");
                this.render();
            },

            openEditUserModal(userId) {
                const users = DB.get("users", []);
                const user = users.find(u => u.id === userId);
                if (!user) return;
                const structure = DB.get("structure", INITIAL_STRUCTURE);
                this.tempUserSignature = user.signature || null;

                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 my-6">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-pen-to-square text-blue-600"></i>
                                <span>تعديل بيانات الموظف (${user.fullName})</span>
                            </h3>
                            <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onsubmit="App.handleSaveEditUser(event, '${user.id}')" class="space-y-4 text-xs">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">الاسم الكامل <span class="text-rose-500">*</span></label>
                                    <input type="text" id="edit-fullname" required value="${user.fullName}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold" />
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">الرقم الوظيفي <span class="text-rose-500">*</span></label>
                                    <input type="text" id="edit-empid" required value="${user.empId || ''}" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold font-mono" />
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">اسم المستخدم</label>
                                    <input type="text" value="${user.username}" disabled class="w-full p-2.5 bg-slate-100 border border-slate-300 rounded-xl font-bold font-mono cursor-not-allowed" />
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">الدور والصلاحية <span class="text-rose-500">*</span></label>
                                    <select id="edit-role" required class="w-full p-2.5 bg-white border border-slate-300 rounded-xl font-bold">
                                        <option value="employee" ${user.role === 'employee' ? 'selected' : ''}>موظف عادي</option>
                                        <option value="head" ${user.role === 'head' ? 'selected' : ''}>رئيس قسم</option>
                                        <option value="manager" ${user.role === 'manager' ? 'selected' : ''}>مدير إدارة</option>
                                        <option value="general_manager" ${user.role === 'general_manager' ? 'selected' : ''}>المدير العام</option>
                                        ${user.role === 'admin' ? `<option value="admin" selected>مشرف عام للنظام</option>` : ''}
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">الإدارة التابع لها <span class="text-rose-500">*</span></label>
                                    <select id="edit-dept" required onchange="App.handleUserDeptChange(this.value, 'edit-section')" class="w-full p-2.5 bg-white border border-slate-300 rounded-xl font-semibold">
                                        <option value="gd-1" ${user.deptId === 'gd-1' ? 'selected' : ''}>${structure.generalDepartment.name}</option>
                                        ${structure.departments.map(d => `<option value="${d.id}" ${user.deptId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">القسم التابع له</label>
                                    <select id="edit-section" class="w-full p-2.5 bg-white border border-slate-300 rounded-xl font-semibold">
                                    </select>
                                </div>
                            </div>

                            <div class="border-t pt-3">
                                <label class="block font-bold text-slate-700 mb-1">التوقيع الإلكتروني</label>
                                <div class="flex items-center gap-3">
                                    <label class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 rounded-xl font-bold cursor-pointer transition">
                                        <i class="fa-solid fa-signature"></i> تحديث صورة التوقيع
                                        <input type="file" accept="image/*" onchange="App.handleUserSignatureUpload(event, 'edit-sig-preview')" class="hidden" />
                                    </label>
                                    <div id="edit-sig-preview" class="h-10 w-24 border border-dashed rounded-lg bg-slate-50 flex items-center justify-center text-[10px] text-slate-400 overflow-hidden">

                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-2">
                                <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-700">إلغاء</button>
                                <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow">حفظ التعديلات</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;

                this.handleUserDeptChange(user.deptId, 'edit-section');
                if (user.sectionId) {
                    setTimeout(() => {
                        const secEl = document.getElementById("edit-section");
                        if (secEl) secEl.value = user.sectionId;
                    }, 50);
                }
            },

            handleSaveEditUser(e, userId) {
                e.preventDefault();
                const users = DB.get("users", []);
                const idx = users.findIndex(u => u.id === userId);
                if (idx === -1) return;

                users[idx].fullName = document.getElementById("edit-fullname").value.trim();
                users[idx].empId = document.getElementById("edit-empid").value.trim();
                users[idx].role = document.getElementById("edit-role").value;
                users[idx].deptId = document.getElementById("edit-dept").value;
                users[idx].sectionId = document.getElementById("edit-section").value;
                users[idx].title = this.getRoleTitle(users[idx].role);
                if (this.tempUserSignature) users[idx].signature = this.tempUserSignature;

                DB.set("users", users);
                this.closeModal();
                this.notify("تم تحديث بيانات الموظف بنجاح", "success");
                this.render();
            },

            confirmDeleteUser(userId) {
                const users = DB.get("users", []);
                const user = users.find(u => u.id === userId);
                if (!user) return;

                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 text-center space-y-4">
                        <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-user-xmark"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm">تأكيد حذف الموظف</h3>
                        <p class="text-xs text-slate-600">هل أنت متأكد من حذف حساب (${user.fullName})؟</p>
                        <div class="flex items-center justify-center gap-2 pt-2">
                            <button onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold text-slate-700">تراجع</button>
                            <button onclick="App.executeDeleteUser('${userId}')" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow">نعم، احذف</button>
                        </div>
                    </div>
                </div>
                `;
            },

            executeDeleteUser(userId) {
                let users = DB.get("users", []);
                users = users.filter(u => u.id !== userId);
                DB.set("users", users);
                this.closeModal();
                this.notify("تم حذف حساب الموظف بنجاح", "info");
                this.render();
            },

            renderAdminResetRequestsView() {
                if (this.currentUser.role !== 'admin') {
                    return `<div class="p-8 text-center text-rose-600 font-bold">عذراً، هذه الشاشة مخصصة لمدير النظام فقط.</div>`;
                }

                const resets = DB.get("reset_requests", []);

                return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-key text-emerald-700"></i>
                                <span>صندوق طلبات استعادة كلمات المرور</span>
                            </h2>
                            <p class="text-xs text-slate-500 mt-1">طلبات الموظفين الذين تعذر عليهم تسجيل الدخول لتوليد كلمات مرور مؤقتة لهم.</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        ${resets.length === 0 ? `
                            <div class="p-8 text-center text-slate-400 space-y-2">
                                <i class="fa-solid fa-shield-check text-4xl text-slate-300"></i>
                                <p class="text-xs font-semibold">لا توجد طلبات استعادة كلمة مرور معلقة</p>
                            </div>
                        ` : `
                            <table class="w-full text-right text-xs">
                                <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                    <tr>
                                        <th class="p-3.5">اسم الموظف المتقدم</th>
                                        <th class="p-3.5">الرقم الوظيفي / الهوية</th>
                                        <th class="p-3.5">تاريخ الطلب</th>
                                        <th class="p-3.5">الحالة</th>
                                        <th class="p-3.5 text-center">الإجراء</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${resets.map(r => `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="p-3.5 font-bold text-slate-800">${r.fullName}</td>
                                            <td class="p-3.5 font-mono text-slate-700">${r.empIdOrUsername}</td>

            handleSubmitForgotPassword(e) {
                e.preventDefault();
                const name = document.getElementById("forgot-name").value.trim();
                const ident = document.getElementById("forgot-ident").value.trim();

                const resets = DB.get("reset_requests", []);
                resets.push({
                    id: "RST-" + Date.now(),
                    fullName: name,
                    empIdOrUsername: ident,
                    requestedAt: new Date().toLocaleString('ar-SA'),
                    status: 'PENDING',
                    tempIssued: null
                });

                DB.set("reset_requests", resets);
                this.closeModal();
                this.notify("تم رفع طلب إعادة التعيين لمدير النظام بنجاح!", "success");
            },

            handleProcessResetPassword(reqId) {
                const resets = DB.get("reset_requests", []);
                const idx = resets.findIndex(r => r.id === reqId);
                if (idx === -1) return;

                const item = resets[idx];
                const users = DB.get("users", []);
                const user = users.find(u => u.username.toLowerCase() === item.empIdOrUsername.toLowerCase() || u.empId === item.empIdOrUsername);

                if (!user) {
                    this.notify("لم يتم العثور على مستخدم مطابق لهذا المعرف في قاعدة البيانات!", "error");
                    return;
                }

                const newTemp = "pass" + Math.floor(1000 + Math.random() * 9000);
                user.passwordHash = newTemp;
                user.mustChangePass = true;
                item.status = 'DONE';
                item.tempIssued = newTemp;

                DB.set("users", users);
                DB.set("reset_requests", resets);
                this.notify(`تم تعيين كلمة المرور المؤقتة (${newTemp}) للموظف بنجاح!`, "success");
                this.render();
            },

                const req = DB.get("requests", []).find(r => r.id === reqId);
                if (!req) return;

                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-pen-to-square text-blue-600"></i>
                                <span>تعديل طلب الاستئذان (${req.id})</span>
                            </h3>
                            <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onsubmit="App.handleSaveEditRequest(event, '${req.id}')" class="space-y-3 text-xs">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">تاريخ الاستئذان <span class="text-rose-500">*</span></label>
                                <input type="date" id="edit-perm-date" required value="${req.permissionDate}" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl font-bold" />
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">وقت البداية / الخروج <span class="text-rose-500">*</span></label>
                                    <input type="time" id="edit-start-time" required value="${req.startTime}" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl font-semibold" />
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">إجمالي الساعات <span class="text-rose-500">*</span></label>
                                    <input type="number" step="0.5" id="edit-total-hours" required value="${req.totalHours}" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-xl font-bold" />
                                </div>
                            </div>

                            <div>
                                <label class="block font-bold text-slate-700 mb-1">سبب الاستئذان <span class="text-rose-500">*</span></label>
                                <textarea id="edit-perm-reason" required rows="3" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl resize-none">${req.reason}</textarea>
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-2">
                                <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-700">إلغاء</button>
                                <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow">حفظ التعديلات</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            },

            handleSaveEditRequest(e, reqId) {
                e.preventDefault();
                const requests = DB.get("requests", []);
                const idx = requests.findIndex(r => r.id === reqId);
                if (idx === -1) return;

                requests[idx].permissionDate = document.getElementById("edit-perm-date").value;
                requests[idx].startTime = document.getElementById("edit-start-time").value;
                requests[idx].totalHours = parseFloat(document.getElementById("edit-total-hours").value) || 1.0;
                requests[idx].reason = document.getElementById("edit-perm-reason").value.trim();

                DB.set("requests", requests);
                this.closeModal();
                this.notify("تم تعديل طلب الاستئذان بنجاح", "success");
                this.render();
            },

            confirmDeleteRequest(reqId) {
                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 text-center space-y-4">
                        <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-trash-can"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm">تأكيد حذف الاستئذان</h3>
                        <p class="text-xs text-slate-600">هل أنت متأكد من رغبتك في حذف طلب الاستئذان (${reqId})؟</p>
                        <div class="flex items-center justify-center gap-2 pt-2">
                            <button onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold text-slate-700">إلغاء</button>
                            <button onclick="App.executeDeleteRequest('${reqId}')" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow">نعم، احذف</button>
                        </div>
                    </div>
                </div>
                `;
            },

            executeDeleteRequest(reqId) {
                let requests = DB.get("requests", []);
                requests = requests.filter(r => r.id !== reqId);
                DB.set("requests", requests);
                this.closeModal();
                this.notify("تم حذف طلب الاستئذان بنجاح", "info");
                this.render();
            },

            openAddDepartmentModal() {
                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-folder-plus text-teal-700"></i>
                                <span>إضافة إدارة جديدة للهيكل</span>
                            </h3>
                            <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onsubmit="App.handleCreateDepartment(event)" class="space-y-3 text-xs">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">اسم الإدارة الجديدة <span class="text-rose-500">*</span></label>
                                <input type="text" id="new-dept-name" required placeholder="مثال: إدارة أمن المعلومات..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold" />
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-2">
                                <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-700">إلغاء</button>
                                <button type="submit" class="px-5 py-2 bg-teal-700 hover:bg-teal-800 text-white rounded-xl font-bold shadow">حفظ الإدارة</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            },

            openAddSectionModal() {
                const structure = DB.get("structure", INITIAL_STRUCTURE);
                const modal = document.getElementById("modal-container");
                modal.innerHTML = `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between border-b pb-3">
                            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                                <i class="fa-solid fa-plus-circle text-emerald-700"></i>
                                <span>إضافة قسم جديد تحت إدارة</span>
                            </h3>
                            <button onclick="App.closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <form onsubmit="App.handleCreateSection(event)" class="space-y-3 text-xs">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">اختر الإدارة التابع لها <span class="text-rose-500">*</span></label>
                                <select id="target-dept-id" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                                    <option value="gd-1">${structure.generalDepartment.name} (قسم مباشر)</option>
                                    ${structure.departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">اسم القسم الجديد <span class="text-rose-500">*</span></label>
                                <input type="text" id="new-sec-name" required placeholder="مثال: قسم الحماية السيبرانية..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold" />
                            </div>

                            <div class="flex items-center justify-end gap-2 pt-2">
                                <button type="button" onclick="App.closeModal()" class="px-4 py-2 bg-slate-100 rounded-xl font-bold text-slate-700">إلغاء</button>
                                <button type="submit" class="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold shadow">حفظ القسم</button>
                            </div>
                        </form>
                    </div>
                </div>
                `;
            },

            handleCreateSection(e) {
                e.preventDefault();
                const targetDeptId = document.getElementById("target-dept-id").value;
                const name = document.getElementById("new-sec-name").value.trim();
                if (!name) return;

                const structure = DB.get("structure", INITIAL_STRUCTURE);
                const newSec = {
                    id: "sec-" + Date.now(),
                    name: name,
                    headId: ""
                };

                if (targetDeptId === 'gd-1') {
                    newSec.deptId = 'gd-1';
                    structure.directSections.push(newSec);
                } else {
                    const dept = structure.departments.find(d => d.id === targetDeptId);
                    if (dept) {
                        dept.sections.push(newSec);
                    }
                }

                DB.set("structure", structure);
                this.structure = structure;
                this.closeModal();
                this.notify("تمت إضافة القسم الجديد بنجاح", "success");
                this.render();
            },

            handleLogoFileSelect(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64 = event.target.result;
                    this.tempUploadedLogo = base64;
                    const preview = document.getElementById("settings-logo-preview");
                    if (preview) {
                        preview.innerHTML = `<img src="${base64}" class="max-h-full max-w-full object-contain" alt="شعار المنشأة">`;
                    }
                };
                reader.readAsDataURL(file);
            },

            removeCustomLogo() {
                const settings = this.getSettings();
                settings.logoUrl = "";
                DB.set("system_settings", settings);
                this.tempUploadedLogo = undefined;
                this.notify("تم حذف الشعار المخصص والعودة للوضع الافتراضي", "info");
                this.render();
            },

            handleSaveSystemSettings(e) {
                e.preventDefault();
                const settings = this.getSettings();

                settings.countryName = document.getElementById("set-country-name").value.trim();
                settings.orgName = document.getElementById("set-org-name").value.trim();
                settings.workStartTime = document.getElementById("set-work-start").value;
                settings.workEndTime = document.getElementById("set-work-end").value;
                settings.reportMargin = document.getElementById("set-rep-margin").value;
                settings.reportOrientation = document.getElementById("set-rep-orientation").value;
                settings.showQRInReport = document.getElementById("set-rep-qr").checked;
                settings.showSignatureInReport = document.getElementById("set-rep-sig").checked;

                if (this.tempUploadedLogo !== undefined) {
                    settings.logoUrl = this.tempUploadedLogo;
                }

                DB.set("system_settings", settings);

                const structure = DB.get("structure", INITIAL_STRUCTURE);
                structure.generalDepartment.name = settings.orgName;
                DB.set("structure", structure);
                this.structure = structure;

                this.notify("تم حفظ وتحديث إعدادات النظام والهوية والدوام بنجاح!", "success");
                this.render();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
