<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة وتوثيق الاستئذانات الإلكتروني</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        @media print {
            .no-print, header, nav, footer, #modalContainer, #toast-container { 
                display: none !important; 
            }
            body { 
                background: white !important; 
                margin: 0 !important; 
                padding: 0 !important; 
            }
            #printableResolutionContainer {
                display: block !important;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                margin: 0;
                padding: 12mm;
                box-sizing: border-box;
            }
            #reportPrintableArea {
                display: block !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center w-full max-w-md px-4 pointer-events-none"></div>

    <!-- Top Navigation Bar -->
    <header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div id="orgLogoContainer" class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center p-1 border border-white/20 overflow-hidden shadow-inner">
                    <i class="fa-solid fa-stamp text-2xl text-emerald-300"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg md:text-xl tracking-tight leading-tight flex items-center gap-2">
                        <span>نظام إدارة الاستئذانات الإلكتروني</span>
                        <span id="cloudStatusBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-700 text-slate-300 border border-white/10">
                            <i class="fa-solid fa-rotate animate-spin ml-1"></i> فحص الاتصال...
                        </span>
                        <span class="text-[10px] font-mono px-2 py-0.5 bg-emerald-950 text-emerald-300 rounded border border-emerald-800">v3.8.0</span>
                    </h1>
                    <p class="text-emerald-200/90 text-xs font-semibold" id="topOrgTitle">الإدارة العامة لتقنية المعلومات والتحول الرقمي</p>
                </div>
            </div>

            <!-- User Header Controls -->
            <div id="userHeaderPanel" class="hidden flex items-center gap-3">
                <div class="bg-emerald-950/60 border border-emerald-700/50 rounded-xl px-3 py-1.5 flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-lg bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shadow">
                        <span id="userAvatarText">م</span>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-sm leading-tight" id="headerUserName">اسم المستخدم</div>
                        <div class="text-[11px] text-emerald-300 font-medium" id="headerUserRole">المسمى الوظيفي</div>
                    </div>
                </div>
                <button onclick="App.logout()" title="تسجيل الخروج" class="p-2.5 rounded-xl bg-red-600/80 hover:bg-red-600 text-white transition shadow flex items-center justify-center">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav id="navTabsContainer" class="hidden bg-emerald-800/80 border-t border-emerald-700/50 px-4">
            <div class="max-w-7xl mx-auto flex gap-1 overflow-x-auto py-1.5" id="tabsList"></div>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full" id="mainContainer"></main>

    <!-- Global Modal -->
    <div id="modalContainer" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto no-print">
        <div id="modalContent" class="bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto transform transition-all p-6 text-right"></div>
    </div>

    <!-- Official Printable Card (Hidden on Screen, Visible on Print) -->
    <div id="printableResolutionContainer" class="hidden"></div>

    <script>
    const SYSTEM_VERSION = "v3.8.0";

    // المفاتيح السحابية العامة المضمنة مباشرة لتعمل على كافة الأجهزة تلقائياً
    const CLOUD_CONFIG = {
        url: "https://psdiohmcupwcxnascxft.supabase.co",
        key: "sb_publishable_zJ2G0PO5yegOImQ1F7wL8Q_bMntahhk"
    };

    const DB_DEFAULT = {
        settings: {
            orgName: "المملكة العربية السعودية",
            generalDept: "الإدارة العامة لتقنية المعلومات والتحول الرقمي",
            reportHeaderTitle: "تقرير عمليات الاستئذان الإدارية",
            logoData: "",
            workStartTime: "07:30",
            workEndTime: "14:30",
            reportMargin: "10",
            reportOrientation: "portrait",
            showQRInReport: true,
            showSignatureInReport: true,
            supabaseUrl: CLOUD_CONFIG.url,
            supabaseKey: CLOUD_CONFIG.key
        },
        departments: [
            { id: "dept_0", name: "الإدارة العامة (أقسام مباشرة)", sections: ["قسم الجودة التقنية"] },
            { id: "dept_1", name: "إدارة الأنظمة والبرامج", sections: ["قسم تطور الأنظمة والبرامج", "قسم الاختبار وجودة الأنظمة والبرامج"] },
            { id: "dept_2", name: "إدارة الدعم الفني", sections: ["قسم خدمات المستفيدين", "قسم الصيانة والتشغيل", "قسم التمويل الفني"] },
            { id: "dept_3", name: "إدارة البنية التحتية", sections: ["قسم الشبكات", "قسم الحوسبة السحابية ومركز البيانات", "قسم المخاطر واستمرارية الأعمال", "قسم أمن وحماية البنية التحتية"] },
            { id: "dept_4", name: "إدارة التحول الرقمي", sections: ["قسم تحليل الأعمال", "قسم تمكين التحول الرقمي", "قسم الإبتكار والذكاء الاصطناعي"] },
            { id: "dept_5", name: "إدارة التخطيط التقني", sections: ["قسم التخطيط والدراسات", "قسم البنية المؤسسية", "مكتب إدارة المشاريع"] }
        ],
        users: [
            {
                id: "usr_admin",
                name: "مدير النظام التقني (Super Admin)",
                username: "admin",
                password: "Hh@537573",
                role: "super_admin",
                empId: "ADM001",
                jobTitle: "مشرف النظام التقني العام",
                deptId: "dept_0",
                sectionName: "",
                signatureData: "",
                mustChangePass: false
            },
            {
                id: "usr_halshuhiyb",
                name: "حسين الشهيب",
                username: "halshuhiyb",
                password: "Hh@537573",
                role: "super_admin",
                empId: "EMP001",
                jobTitle: "مدير عام تقنية المعلومات والتحول الرقمي",
                deptId: "dept_0",
                sectionName: "",
                signatureData: "",
                mustChangePass: false
            }
        ],
        requests: [],
        delegations: [],
        resetRequests: []
    };

    const App = {
        db: DB_DEFAULT,
        currentUser: null,
        activeTab: "dashboard",
        supabaseClient: null,

        async init() {
            this.loadDB();
            this.initSupabase();
            // جلب تلقائي لحظي للبيانات من السحابة في أي جهاز أو متصفح يفتح الصفحة
            await this.pullFromCloud(false);
            this.checkSession();
        },

        loadDB() {
            const raw = localStorage.getItem("LEAVE_SYS_DATA_V4") || localStorage.getItem("LEAVE_SYS_DATA_V3") || localStorage.getItem("LEAVE_SYS_DATA");
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    this.db = Object.assign({}, DB_DEFAULT, parsed);
                } catch(e) {
                    console.error("Local data parse error", e);
                }
            } else {
                this.db = JSON.parse(JSON.stringify(DB_DEFAULT));
            }
            // إجبار تطبيق المفتاح السحابي الموحد على أي جهاز
            this.db.settings.supabaseUrl = CLOUD_CONFIG.url;
            this.db.settings.supabaseKey = CLOUD_CONFIG.key;
            this.saveDB(false);
        },

        saveDB(syncToCloud = true) {
            localStorage.setItem("LEAVE_SYS_DATA_V4", JSON.stringify(this.db));
            this.updateHeaderUI();
            if (syncToCloud && this.supabaseClient) {
                this.pushToCloud(false);
            }
        },

        initSupabase() {
            const url = CLOUD_CONFIG.url;
            const key = CLOUD_CONFIG.key;
            const badge = document.getElementById("cloudStatusBadge");

            if (window.supabase) {
                try {
                    this.supabaseClient = window.supabase.createClient(url, key);
                    if (badge) {
                        badge.className = "text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500 text-white border border-white/20";
                        badge.innerHTML = `<i class="fa-solid fa-cloud-check ml-1"></i> سحابي متصل (Supabase)`;
                    }
                } catch (e) {
                    console.warn("Supabase init err:", e);
                }
            }
        },

        async pushToCloud(showAlert = true) {
            if (!this.supabaseClient) return false;
            try {
                const { error } = await this.supabaseClient.from("app_state").upsert({
                    id: 1,
                    payload: this.db,
                    updated_at: new Date().toISOString()
                });
                if (error) throw error;
                if (showAlert) alert("✅ تم رفع وحفظ كافة بيانات النظام إلى قاعدة بيانات Supabase بنجاح!");
                return true;
            } catch (err) {
                if (showAlert) alert("❌ فشل الرفع للسحابة:\n" + err.message);
                return false;
            }
        },

        async pullFromCloud(showAlert = true) {
            if (!this.supabaseClient) return false;
            try {
                const { data, error } = await this.supabaseClient.from("app_state").select("payload").eq("id", 1).maybeSingle();
                if (error) throw error;
                if (data && data.payload) {
                    this.db = Object.assign({}, DB_DEFAULT, data.payload);
                    this.db.settings.supabaseUrl = CLOUD_CONFIG.url;
                    this.db.settings.supabaseKey = CLOUD_CONFIG.key;
                    this.saveDB(false);
                    this.updateHeaderUI();
                    if (showAlert) {
                        alert("✅ تم استرجاع وتحديث كافة البيانات من السحابة بنجاح!");
                        if (this.currentUser) this.setTab(this.activeTab);
                    }
                    return true;
                }
            } catch (err) {
                console.warn("Cloud pull note:", err);
            }
            return false;
        },

        async testCloudConnection() {
            const resultBox = document.getElementById("connectionTestResult");
            if (!resultBox) return;
            resultBox.classList.remove("hidden");
            resultBox.innerHTML = `<div class="p-3 bg-blue-50 border border-blue-200 text-blue-800 rounded-xl flex items-center gap-2"><i class="fa-solid fa-spinner animate-spin"></i><span>جاري فحص الاتصال...</span></div>`;

            try {
                const start = performance.now();
                const { data, error } = await this.supabaseClient.from("app_state").select("id, updated_at").eq("id", 1);
                const latency = Math.round(performance.now() - start);
                if (error) throw error;

                resultBox.innerHTML = `
                    <div class="p-4 bg-emerald-50 border border-emerald-300 text-emerald-900 rounded-xl space-y-2">
                        <div class="flex items-center gap-2 font-black text-sm text-emerald-800">
                            <i class="fa-solid fa-circle-check text-base"></i>
                            <span>الاتصال السحابي سليم 100% وجاهز للعمل!</span>
                        </div>
                        <div class="text-xs space-y-1 font-mono text-emerald-700">
                            <p>• سرعة الاستجابة (Latency): <strong>${latency}ms</strong></p>
                            <p>• جدول المزامنة (app_state): <strong>متصل ونشط</strong></p>
                        </div>
                    </div>
                `;
            } catch (err) {
                resultBox.innerHTML = `
                    <div class="p-4 bg-red-50 border border-red-300 text-red-900 rounded-xl space-y-2 text-xs">
                        <div class="font-bold flex items-center gap-2 text-red-700 text-sm">
                            <i class="fa-solid fa-circle-xmark"></i>
                            <span>فشل الاتصال بقاعدة البيانات</span>
                        </div>
                        <p class="font-mono bg-white p-2 rounded border border-red-200">${err.message}</p>
                    </div>
                `;
            }
        },

        checkSession() {
            const uid = sessionStorage.getItem("LEAVE_ACTIVE_UID");
            if (uid) {
                const user = this.db.users.find(u => u.id === uid);
                if (user) {
                    this.setCurrentUser(user);
                    return;
                }
            }
            this.renderLoginView();
        },

        setCurrentUser(user) {
            this.currentUser = user;
            sessionStorage.setItem("LEAVE_ACTIVE_UID", user.id);
            this.updateHeaderUI();

            document.getElementById("userHeaderPanel").classList.remove("hidden");
            document.getElementById("navTabsContainer").classList.remove("hidden");
            document.getElementById("headerUserName").innerText = user.name;
            document.getElementById("headerUserRole").innerText = `${user.jobTitle} - ${this.getRoleTitle(user.role)}`;
            document.getElementById("userAvatarText").innerText = user.name.charAt(0);

            this.renderTabs();
            this.setTab('dashboard');
        },

        logout() {
            sessionStorage.removeItem("LEAVE_ACTIVE_UID");
            this.currentUser = null;
            document.getElementById("userHeaderPanel").classList.add("hidden");
            document.getElementById("navTabsContainer").classList.add("hidden");
            this.renderLoginView();
        },

        updateHeaderUI() {
            const topTitle = document.getElementById("topOrgTitle");
            if (topTitle) topTitle.innerText = this.db.settings.generalDept || "الإدارة العامة لتقنية المعلومات والتحول الرقمي";
            const logoCont = document.getElementById("orgLogoContainer");
            if (logoCont) {
                if (this.db.settings.logoData) {
                    logoCont.innerHTML = `<img src="${this.db.settings.logoData}" class="w-full h-full object-contain" alt="Logo">`;
                } else {
                    logoCont.innerHTML = `<i class="fa-solid fa-stamp text-2xl text-emerald-300"></i>`;
                }
            }
        },

        getRoleTitle(role) {
            const map = {
                super_admin: "مدير النظام (Super Admin)",
                gen_manager: "المدير العام",
                dept_manager: "مدير إدارة",
                section_head: "رئيس قسم",
                employee: "موظف"
            };
            return map[role] || "موظف";
        },

        renderTabs() {
            const list = document.getElementById("tabsList");
            const r = this.currentUser ? this.currentUser.role : "";
            const isManager = ['super_admin', 'gen_manager', 'dept_manager', 'section_head'].includes(r);
            const isSuper = r === 'super_admin';

            let tabs = [
                { id: 'dashboard', label: 'الرئيسية (الإحصاءات)', icon: 'fa-solid fa-gauge-high' },
                { id: 'my_requests', label: 'استئذاناتي', icon: 'fa-solid fa-user-clock' }
            ];

            if (isManager) {
                tabs.push({ id: 'approvals', label: 'صندوق الاعتمادات', icon: 'fa-solid fa-clipboard-check' });
                tabs.push({ id: 'delegations', label: 'التفويض الإداري', icon: 'fa-solid fa-user-shield' });
            }

            tabs.push({ id: 'reports', label: 'التقارير والإحصائيات', icon: 'fa-solid fa-chart-pie' });

            if (isSuper) {
                tabs.push({ id: 'admin_users', label: 'إدارة الموظفين والصلاحيات', icon: 'fa-solid fa-users-gear' });
                tabs.push({ id: 'admin_resets', label: 'طلبات استعادة الكلمات', icon: 'fa-solid fa-key' });
                tabs.push({ id: 'settings', label: 'إعدادات النظام والدوام', icon: 'fa-solid fa-gears' });
            }

            list.innerHTML = tabs.map(t => `
                <button onclick="App.setTab('${t.id}')"
                    class="px-4 py-2 rounded-lg font-bold text-xs whitespace-nowrap flex items-center gap-2 transition duration-150 ${this.activeTab === t.id ? 'bg-emerald-950 text-white shadow' : 'text-emerald-100 hover:bg-emerald-700/60'}">
                    <i class="${t.icon}"></i>
                    <span>${t.label}</span>
                </button>
            `).join("");
        },

        setTab(tabId) {
            this.activeTab = tabId;
            this.renderTabs();
            const container = document.getElementById("mainContainer");
            container.innerHTML = "";

            if (tabId === 'dashboard') {
                this.renderDashboardView(container);
            } else if (tabId === 'settings') {
                this.renderSettingsView(container);
            } else if (tabId === 'admin_users') {
                this.renderAdminUsersView(container);
            } else if (tabId === 'admin_resets') {
                this.renderAdminResetsView(container);
            } else if (tabId === 'approvals') {
                this.renderApprovalsView(container);
            } else if (tabId === 'delegations') {
                this.renderDelegationsView(container);
            } else if (tabId === 'reports') {
                this.renderReportsView(container);
            } else {
                this.renderMyRequestsView(container);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        // --- تسجيل الدخول ---
        renderLoginView() {
            const container = document.getElementById("mainContainer");
            container.innerHTML = `
                <div class="max-w-md mx-auto my-12 bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden text-right p-8">
                    <div class="text-center mb-6">
                        <div class="w-20 h-20 bg-emerald-50 rounded-2xl mx-auto flex items-center justify-center p-2 mb-3 border border-emerald-100 shadow-sm">
                            ${this.db.settings.logoData ? `<img src="${this.db.settings.logoData}" class="max-h-full max-w-full object-contain">` : `<i class="fa-solid fa-building-columns text-3xl text-emerald-700"></i>`}
                        </div>
                        <h2 class="text-lg font-black text-slate-800">${this.db.settings.generalDept}</h2>
                        <p class="text-xs text-slate-500 font-semibold mt-1">تسجيل الدخول لبوابة استئذان الموظفين</p>
                    </div>

                    <form onsubmit="App.handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم</label>
                            <div class="relative">
                                <i class="fa-solid fa-user absolute right-3.5 top-3.5 text-slate-400 text-sm"></i>
                                <input type="text" id="loginUsername" required placeholder="admin أو halshuhiyb"
                                    class="w-full pr-10 pl-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                            <div class="relative">
                                <i class="fa-solid fa-lock absolute right-3.5 top-3.5 text-slate-400 text-sm"></i>
                                <input type="password" id="loginPassword" required placeholder="••••••••"
                                    class="w-full pr-10 pl-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <button type="button" onclick="App.togglePasswordVisibility('loginPassword', this)"
                                    class="absolute left-3 top-3 text-slate-400 hover:text-slate-600">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-black text-sm shadow-lg shadow-emerald-700/20 transition duration-150">
                            <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i> دخول النظام
                        </button>
                    </form>
                </div>
            `;
        },

        handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("loginUsername").value.trim().toLowerCase();
            const p = document.getElementById("loginPassword").value;

            const user = this.db.users.find(x => x.username.toLowerCase() === u && x.password === p);
            if (!user) {
                alert("خطأ: اسم المستخدم أو كلمة المرور غير صحيحة!");
                return;
            }
            this.setCurrentUser(user);
        },

        togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPass = input.type === 'password';
            input.type = isPass ? 'text' : 'password';
            btn.innerHTML = isPass ? `<i class="fa-solid fa-eye-slash text-emerald-700"></i>` : `<i class="fa-solid fa-eye"></i>`;
        },

        // --- الرئيسية (المؤشرات والإحصاءات) ---
        renderDashboardView(container) {
            const isManager = ['super_admin', 'gen_manager', 'dept_manager', 'section_head'].includes(this.currentUser.role);
            const myRequests = this.db.requests.filter(r => r.userId === this.currentUser.id);
            const pendingMyRequests = myRequests.filter(r => r.status === 'pending').length;
            const approvedThisMonth = myRequests.filter(r => r.status === 'approved').length;
            const totalHours = myRequests.filter(r => r.status === 'approved').reduce((acc, curr) => acc + (parseFloat(curr.hours) || 0), 0);
            const totalPendingApprovals = this.db.requests.filter(r => r.status === 'pending').length;
            const allRequestsCount = this.db.requests.length;

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-emerald-800 to-teal-900 rounded-3xl p-6 sm:p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <span class="px-3 py-1 bg-white/10 rounded-full text-xs font-bold text-emerald-200 border border-white/10">
                                ${this.getDeptName(this.currentUser.deptId)} ${this.currentUser.sectionName ? '› ' + this.currentUser.sectionName : ''}
                            </span>
                            <h2 class="text-2xl sm:text-3xl font-black mt-2">أهلاً بك، ${this.currentUser.name}</h2>

            return `

                            <th class="p-3 text-center">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 font-semibold text-slate-700">
                        ${list.map(r => `
                            <tr>
                                <td class="p-3 font-mono font-bold text-emerald-800">${r.refNo}</td>
                                <td class="p-3">${this.getTypeBadge(r.type)}</td>

                                <td class="p-3 text-center">
                                    ${r.status === 'approved' ? `
                                        <button onclick="App.printResolution('${r.id}')" class="px-2.5 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 rounded-lg font-bold">

                                        </button>

                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        },

        // --- شاشة التقارير الاحترافية المحدثة ---
        renderReportsView(container) {
            const isGenManagerOrSuper = ['super_admin', 'gen_manager'].includes(this.currentUser.role);
            const isDeptManager = this.currentUser.role === 'dept_manager';
            const isManager = ['super_admin', 'gen_manager', 'dept_manager', 'section_head'].includes(this.currentUser.role);

            let selectableUsers = [];
            if (isGenManagerOrSuper) {
                selectableUsers = this.db.users;
            } else if (isDeptManager) {
                selectableUsers = this.db.users.filter(u => u.deptId === this.currentUser.deptId);
            } else if (this.currentUser.role === 'section_head') {
                selectableUsers = this.db.users.filter(u => u.sectionName === this.currentUser.sectionName);
            }

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="flex flex-wrap justify-between items-center gap-3 no-print">
                        <div>
                            <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-chart-pie text-emerald-700"></i>
                                <span>${this.db.settings.reportHeaderTitle || 'مركز التقارير والإحصائيات التوثيقية'}</span>
                            </h2>
                            <p class="text-xs text-slate-500 font-semibold mt-1">تصفية وحصر عمليات الاستئذان واستخراج التقارير الرسمية</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.print()" class="px-5 py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white rounded-xl font-bold text-xs shadow flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-print"></i> طباعة التقرير الرسمي
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 no-print text-right">
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">من تاريخ</label>
                                <input type="date" id="repFilterFrom" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono font-bold">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">إلى تاريخ</label>
                                <input type="date" id="repFilterTo" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-mono font-bold">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">حالة الطلب</label>
                                <select id="repFilterStatus" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                                    <option value="ALL">جميع الحالات</option>
                                    <option value="approved">معتمد فقط</option>
                                    <option value="pending">قيد الانتظار</option>
                                    <option value="rejected">مرفوض</option>
                                </select>
                            </div>

                            ${isManager ? `
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">تحديد الموظف</label>
                                    <select id="repFilterUser" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                                        <option value="ALL">${isGenManagerOrSuper ? 'جميع موظفي المنظومة' : 'جميع موظفي إدارتي'}</option>
                                        <option value="${this.currentUser.id}">[استئذاناتي الشخصية فقط]</option>
                                        ${selectableUsers.filter(u => u.id !== this.currentUser.id).map(u => `<option value="${u.id}">${u.name} (${u.empId})</option>`).join("")}
                                    </select>
                                </div>
                            ` : `
                                <div class="flex items-end">
                                    <div class="w-full p-2.5 bg-slate-100 border rounded-xl text-slate-600 font-bold text-center">
                                        عرض استئذاناتك الشخصية
                                    </div>
                                </div>
                            `}
                        </div>

                        <div class="flex justify-end pt-2 border-t">
                            <button onclick="App.applyReportFilter()" class="px-6 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold shadow flex items-center gap-1.5">
                                <i class="fa-solid fa-filter"></i> تطبيق التصفية والبحث
                            </button>
                        </div>
                    </div>

                    <div id="reportPrintableArea" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden p-6 space-y-5">
                        <div class="flex justify-between items-center border-b pb-4 text-right">
                            <div class="space-y-1">
                                <h3 class="font-black text-sm text-slate-800">${this.db.settings.orgName}</h3>
                                <p class="text-xs font-bold text-emerald-800">${this.db.settings.generalDept}</p>
                                <p class="text-xs font-bold text-slate-600">${this.db.settings.reportHeaderTitle || 'تقرير عمليات الاستئذان الإدارية'}</p>
                            </div>
                            <div class="w-16 h-16 border rounded-xl p-1 flex items-center justify-center overflow-hidden">
                                ${this.db.settings.logoData ? `<img src="${this.db.settings.logoData}" class="max-h-full max-w-full object-contain">` : `<i class="fa-solid fa-stamp text-2xl text-emerald-700"></i>`}
                            </div>
                            <div class="text-left font-mono text-xs text-slate-500 space-y-1">
                                <p>تاريخ الاستخراج: <strong>${new Date().toISOString().split("T")[0]}</strong></p>
                                <p>المستخرج: <strong>${this.currentUser.name}</strong></p>
                            </div>
                        </div>

                        <div id="reportQuickMetrics" class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border text-center text-xs font-bold"></div>

                        <div id="reportTableContainer" class="overflow-x-auto"></div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                this.applyReportFilter();
            }, 50);
        },

        applyReportFilter() {
            const from = document.getElementById("repFilterFrom")?.value;
            const to = document.getElementById("repFilterTo")?.value;
            const status = document.getElementById("repFilterStatus")?.value || 'ALL';
            const isManager = ['super_admin', 'gen_manager', 'dept_manager', 'section_head'].includes(this.currentUser.role);
            const userFilter = isManager ? (document.getElementById("repFilterUser")?.value || 'ALL') : this.currentUser.id;

            let list = this.db.requests;

            if (this.currentUser.role === 'employee') {
                list = list.filter(r => r.userId === this.currentUser.id);
            } else if (this.currentUser.role === 'dept_manager') {
                if (userFilter === 'ALL') {
                    list = list.filter(r => r.deptId === this.currentUser.deptId);
                } else {
                    list = list.filter(r => r.userId === userFilter);
                }
            } else if (this.currentUser.role === 'section_head') {
                if (userFilter === 'ALL') {
                    list = list.filter(r => r.sectionName === this.currentUser.sectionName);
                } else {
                    list = list.filter(r => r.userId === userFilter);
                }
            } else if (['super_admin', 'gen_manager'].includes(this.currentUser.role)) {
                if (userFilter !== 'ALL') {
                    list = list.filter(r => r.userId === userFilter);
                }
            }

            if (from) list = list.filter(r => r.leaveDate >= from);
            if (to) list = list.filter(r => r.leaveDate <= to);
            if (status !== 'ALL') list = list.filter(r => r.status === status);

            const approvedCount = list.filter(r => r.status === 'approved').length;
            const totalHours = list.filter(r => r.status === 'approved').reduce((acc, curr) => acc + (parseFloat(curr.hours) || 0), 0);
            const pendingCount = list.filter(r => r.status === 'pending').length;
            const rejectedCount = list.filter(r => r.status === 'rejected').length;

            const metricsBox = document.getElementById("reportQuickMetrics");
            if (metricsBox) {
                metricsBox.innerHTML = `
                    <div class="p-2 bg-white rounded-lg border">إجمالي العمليات: <span class="font-black text-slate-800 block text-base">${list.length}</span></div>
                    <div class="p-2 bg-white rounded-lg border">المعتمدة: <span class="font-black text-emerald-700 block text-base">${approvedCount} (${totalHours.toFixed(1)} س)</span></div>
                    <div class="p-2 bg-white rounded-lg border">قيد الانتظار: <span class="font-black text-amber-600 block text-base">${pendingCount}</span></div>
                    <div class="p-2 bg-white rounded-lg border">المرفوضة: <span class="font-black text-red-600 block text-base">${rejectedCount}</span></div>
                `;
            }

            const tableBox = document.getElementById("reportTableContainer");
            if (tableBox) {
                if (list.length === 0) {
                    tableBox.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs font-semibold">لا توجد سجلات استئذان مطابقة لشروط البحث والتصفية المحددة</div>`;
                } else {
                    tableBox.innerHTML = `
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                <tr>
                                    <th class="p-3">رقم الطلب</th>
                                    <th class="p-3">اسم الموظف</th>
                                    <th class="p-3">الإدارة والقسم</th>
                                    <th class="p-3">نوع الاستئذان</th>
                                    <th class="p-3">تاريخ الاستئذان</th>
                                    <th class="p-3">الساعات</th>
                                    <th class="p-3">الحالة</th>
                                    <th class="p-3">المعتمد</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 font-semibold text-slate-700">
                                ${list.map(r => `
                                    <tr>
                                        <td class="p-3 font-mono font-bold text-emerald-800">${r.refNo}</td>
                                        <td class="p-3 font-bold text-slate-800">${r.userName} <span class="text-[10px] text-slate-400 font-mono">(${r.empId})</span></td>
                                        <td class="p-3">${this.getDeptName(r.deptId)} - ${r.sectionName || 'إدارة مباشرة'}</td>
                                        <td class="p-3">${this.getTypeBadge(r.type)}</td>
                                        <td class="p-3 font-mono">${r.leaveDate}</td>
                                        <td class="p-3 font-bold">${r.hours} س</td>
                                        <td class="p-3">${this.getStatusBadge(r.status)}</td>
                                        <td class="p-3 text-slate-500">${r.decisionBy || '—'}</td>
                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    `;
                }
            }
        },

        // --- طباعة القرار الرسمي المعزول ---
        printResolution(reqId) {
            const req = this.db.requests.find(x => x.id === reqId);
            if (!req) return;
            const printBox = document.getElementById("printableResolutionContainer");

            let cleanApproverName = req.decisionBy || "المدير المختص";
            if (cleanApproverName.includes("(")) {
                cleanApproverName = cleanApproverName.split("(")[0].trim();
            }

            printBox.innerHTML = `
                <div class="max-w-3xl mx-auto p-8 border-2 border-slate-800 rounded-2xl bg-white text-right space-y-6">
                    <div class="flex justify-between items-center border-b-2 border-slate-800 pb-4">
                        <div class="text-right text-xs font-bold leading-relaxed">
                            <p>${this.db.settings.orgName}</p>
                            <p class="text-sm font-black">${this.db.settings.generalDept}</p>
                            <p>${this.getDeptName(req.deptId)}</p>
                            <p>${req.sectionName ? req.sectionName : 'تابع للإدارة مباشرة'}</p>
                        </div>
                        <div class="w-20 h-20 border border-slate-300 rounded-xl p-1 flex items-center justify-center">
                            ${this.db.settings.logoData ? `<img src="${this.db.settings.logoData}" class="max-h-full max-w-full object-contain">` : `<i class="fa-solid fa-stamp text-4xl text-slate-700"></i>`}
                        </div>
                        <div class="text-left text-xs font-mono font-bold leading-relaxed">
                            <p>رقم القرار: ${req.refNo}</p>
                            <p>تاريخ الرفع: ${req.applyDate}</p>
                            <p>تاريخ الاستئذان: ${req.leaveDate}</p>
                        </div>
                    </div>

                    <div class="text-center py-2">
                        <h2 class="text-xl font-black underline underline-offset-8">قرار موافقة على طلب استئذان موظف</h2>
                    </div>

                    <table class="w-full border-collapse border border-slate-400 text-xs">
                        <tr>
                            <td class="border border-slate-300 bg-slate-100 p-2 font-bold w-1/4">اسم الموظف:</td>
                            <td class="border border-slate-300 p-2 font-bold">${req.userName}</td>
                            <td class="border border-slate-300 bg-slate-100 p-2 font-bold w-1/4">الرقم الوظيفي:</td>
                            <td class="border border-slate-300 p-2 font-mono">${req.empId}</td>
                        </tr>
                        <tr>
                            <td class="border border-slate-300 bg-slate-100 p-2 font-bold">المسمى الوظيفي:</td>
                            <td class="border border-slate-300 p-2">${req.jobTitle}</td>
                            <td class="border border-slate-300 bg-slate-100 p-2 font-bold">نوع الاستئذان:</td>
                            <td class="border border-slate-300 p-2 font-bold">${this.getTypeBadge(req.type)}</td>
                        </tr>
                        <tr>
                            <td class="border border-slate-300 bg-slate-100 p-2 font-bold">التوقيت والمدة:</td>
                            <td class="border border-slate-300 p-2 font-bold">${req.timingText} (${req.hours} ساعات)</td>
                            <td class="border border-slate-300 bg-slate-100 p-2 font-bold">تاريخ الاستئذان:</td>
                            <td class="border border-slate-300 p-2 font-mono">${req.leaveDate}</td>
                        </tr>
                        <tr>
                            <td class="border border-slate-300 bg-slate-100 p-2 font-bold">سبب الاستئذان:</td>
                            <td colspan="3" class="border border-slate-300 p-2">${req.reason}</td>
                        </tr>
                    </table>

                    <div class="p-4 bg-slate-50 border border-slate-300 rounded-xl text-xs font-semibold leading-relaxed">
                        بناءً على الصلاحيات المخولة نظاماً، تمت الموافقة والاعتماد الإداري على طلب الاستئذان الموضح أعلاه، وتعتبر هذه الوثيقة إشعاراً رسمياً معتمداً وموثقاً إلكترونياً لدى الإدارة.
                    </div>

                    <div class="flex justify-between items-end pt-6">
                        <div id="printQrCode" class="w-24 h-24 border p-1 bg-white rounded"></div>
                        <div class="text-center space-y-1">
                            <p class="text-xs font-bold text-slate-500">المعتمد:</p>
                            <p class="text-sm font-black text-slate-900">${cleanApproverName}</p>
                            <div class="h-14 flex items-center justify-center">
                                ${req.decisionSign ? `<img src="${req.decisionSign}" class="max-h-full max-w-[140px] object-contain">` : `<span class="text-xs font-serif text-slate-400">توقيع إلكتروني معتمد</span>`}
                            </div>
                            <p class="text-[10px] text-slate-400 font-mono">التاريخ: ${req.decisionDate}</p>
                        </div>
                    </div>
                </div>
            `;

            new QRCode(document.getElementById("printQrCode"), {
                text: `LEAVE-VERIFY:${req.refNo}|${req.userName}|${req.leaveDate}|VALID`,
                width: 90,
                height: 90
            });

            printBox.classList.remove("hidden");
            window.print();
            printBox.classList.add("hidden");
        },

        // --- الإعدادات والدوام والهيكل ---
        renderSettingsView(container) {
            container.innerHTML = `
                <div class="mb-6 flex flex-wrap justify-between items-center gap-3">
                    <div>
                        <h2 class="text-xl font-black text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-gears text-emerald-700"></i>
                            <span>إعدادات النظام والدوام وقاعدة البيانات</span>
                        </h2>
                        <p class="text-xs text-slate-500 font-semibold mt-1">تخصيص الهوية، مواعيد الدوام، أدوات فحص الاتصال السحابي، وحوكمة الهيكل الإداري</p>
                    </div>
                    <span class="text-xs font-mono font-bold px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full border border-emerald-300">
                        رقم الإصدار: ${SYSTEM_VERSION}
                    </span>

                                                    <i class="fa-solid fa-trash-can"></i> حذف
                                                </button>
                                            </div>
                                        </div>

                                                        <span class="text-[10px] text-slate-400">(${secUsersCount} موظف)</span>

                                <p class="text-[11px] text-slate-500">تنزيل كامل ملفات وقاعدة بيانات النظام على جهازك</p>
                                <button onclick="App.exportBackupJSON()" class="w-full py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg font-bold text-xs shadow">تصدير الآن</button>
                            </div>

                            <div class="p-3.5 bg-slate-50 border rounded-xl text-center space-y-2">
                                <i class="fa-solid fa-file-arrow-up text-2xl text-blue-600"></i>

                                <p class="text-[11px] text-slate-500">رفع ملف نسخة سابقة واسترجاع كافة البيانات</p>

                                <i class="fa-solid fa-triangle-exclamation text-2xl text-red-600"></i>

                                <p class="text-[11px] text-red-600">مسح البيانات بالكامل وتوليد نسخة احتياطية فورية قبل الحذف</p>

        handleLogoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                App.db.settings.logoData = evt.target.result;
                App.saveDB();
                App.setTab("settings");
            };
            reader.readAsDataURL(file);
        },

        removeLogo() {
            if (confirm("هل تريد العودة للشعار الافتراضي؟")) {
                this.db.settings.logoData = "";
                this.saveDB();
                this.setTab("settings");
            }
        },

        saveGeneralSettings() {
            this.db.settings.generalDept = document.getElementById("setGenDept").value.trim();
            this.db.settings.reportHeaderTitle = document.getElementById("setReportTitle")?.value.trim() || "مركز التقارير والإحصائيات التوثيقية";
            this.saveDB();
            alert("تم حفظ وتحديث بيانات المنشأة وعناوين التقارير بنجاح.");
        },

        saveWorkTimes() {
            this.db.settings.workStartTime = document.getElementById("setWorkStart").value;
            this.db.settings.workEndTime = document.getElementById("setWorkEnd").value;
            this.saveDB();
            alert("تم حفظ مواعيد الدوام الرسمي وسيعتمدها النظام تلقائياً في حساب الساعات.");
        },

        openAddDepartmentPrompt() {
            const name = prompt("أدخل مسمى الإدارة الجديدة:");
            if (name && name.trim()) {
                this.db.departments.push({
                    id: "dept_" + Date.now(),
                    name: name.trim(),
                    sections: []
                });
                this.saveDB();
                this.setTab("settings");
            }
        },

        renameDept(deptId) {
            const dept = this.db.departments.find(d => d.id === deptId);
            if (!dept) return;
            const newName = prompt("أدخل المسمى الجديد للإدارة:", dept.name);
            if (newName && newName.trim() && newName.trim() !== dept.name) {
                dept.name = newName.trim();
                this.saveDB();
                this.setTab("settings");
            }
        },

        safeDeleteDept(deptId) {
            const count = this.db.users.filter(u => u.deptId === deptId).length;
            if (count > 0) {
                alert(`⚠️ تعذر الحذف!\n\nهناك (${count}) موظف مسجلون تحت هذه الإدارة حالياً.\nيمنع النظام حذف أي إدارة قبل نقل الموظفين منها إلى إدارة أخرى لحفظ سجلاتهم.`);
                return;
            }
            if (confirm("هل أنت متأكد من حذف هذه الإدارة لعدم وجود موظفين مسجلين بها؟")) {
                this.db.departments = this.db.departments.filter(d => d.id !== deptId);
                this.saveDB();
                this.setTab("settings");
            }
        },

        addSectionToDept(deptId) {
            const dept = this.db.departments.find(d => d.id === deptId);
            if (!dept) return;
            const sec = prompt(`أدخل اسم القسم التابع لـ (${dept.name}):`);
            if (sec && sec.trim()) {
                if (!dept.sections) dept.sections = [];
                dept.sections.push(sec.trim());
                this.saveDB();
                this.setTab("settings");
            }
        },

        renameSection(deptId, oldSec) {
            const dept = this.db.departments.find(d => d.id === deptId);
            if (!dept) return;
            const newSec = prompt("أدخل اسم القسم الجديد:", oldSec);
            if (newSec && newSec.trim() && newSec.trim() !== oldSec) {
                const idx = dept.sections.indexOf(oldSec);
                if (idx !== -1) dept.sections[idx] = newSec.trim();
                this.db.users.forEach(u => {
                    if (u.deptId === deptId && u.sectionName === oldSec) u.sectionName = newSec.trim();
                });
                this.saveDB();
                this.setTab("settings");
            }
        },

        safeDeleteSection(deptId, secName) {
            const count = this.db.users.filter(u => u.deptId === deptId && u.sectionName === secName).length;
            if (count > 0) {
                alert(`⚠️ لا يمكن حذف القسم!\n\nيوجد (${count}) موظف مسجلون في هذا القسم.\nيرجى استخدام خيار (نقل موظفين بين الإدارات) لنقلهم أولاً.`);
                return;
            }
            if (confirm(`هل أنت متأكد من حذف قسم (${secName})؟`)) {
                const dept = this.db.departments.find(d => d.id === deptId);
                if (dept && dept.sections) {
                    dept.sections = dept.sections.filter(s => s !== secName);
                    this.saveDB();
                    this.setTab("settings");
                }
            }
        },

        exportBackupJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.db, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", `LEAVE_SYSTEM_BACKUP_${new Date().toISOString().split("T")[0]}.json`);
            document.body.appendChild(a);
            a.click();
            a.remove();
        },

        importBackupJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (parsed.users && parsed.departments) {
                        App.db = parsed;
                        App.db.settings.supabaseUrl = CLOUD_CONFIG.url;
                        App.db.settings.supabaseKey = CLOUD_CONFIG.key;
                        App.saveDB();
                        alert("تمت استعادة النسخة الاحتياطية بنجاح!");
                        location.reload();
                    } else {
                        alert("الملف غير صالح أو لا يحتوي على بنية بيانات النظام الصحيحة.");
                    }
                } catch(err) {
                    alert("خطأ أثناء قراءة ملف النسخة الاحتياطية.");
                }
            };
            reader.readAsText(file);
        },

        factoryResetSystem() {
            if (confirm("⚠️ تحذير:\nسيتم حذف جميع الطلبات وتصفير النظام بالكامل!\nسيقوم النظام فوراً بتنزيل نسخة احتياطية قبل التصفير لحفظ بياناتك.\n\nهل تريد المتابعة؟")) {
                this.exportBackupJSON();
                localStorage.removeItem("LEAVE_SYS_DATA_V4");
                this.db = JSON.parse(JSON.stringify(DB_DEFAULT));
                this.saveDB();
                alert("تم تهيئة النظام بالكامل وتنزيل نسخة احتياطية.");
                location.reload();
            }
        },

        // --- استئذاناتي ---
        renderMyRequestsView(container) {
            const myRequests = this.db.requests.filter(r => r.userId === this.currentUser.id);
            container.innerHTML = `
                <div class="flex flex-wrap justify-between items-center gap-3 mb-6">

                        <h2 class="text-xl font-black text-slate-800">طلبات الاستئذان الخاصة بي</h2>
                        <p class="text-xs text-slate-500 font-semibold">رفع ومتابعة طلبات الاستئذان الشخصية وطباعة القرارات</p>
                    </div>
                    <button onclick="App.openNewRequestModal()" class="px-5 py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl font-bold text-sm shadow flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> طلب استئذان جديد
                    </button>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                <tr>
                                    <th class="p-3.5">رقم الطلب</th>
                                    <th class="p-3.5">نوع الاستئذان</th>
                                    <th class="p-3.5">تاريخ الاستئذان</th>
                                    <th class="p-3.5">التوقيت والمدة</th>
                                    <th class="p-3.5">الحالة</th>
                                    <th class="p-3.5">ملاحظات / سبب الرفض</th>
                                    <th class="p-3.5 text-center">الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 font-semibold text-slate-700">
                                ${myRequests.length === 0 ? `
                                    <tr>
                                        <td colspan="7" class="p-8 text-center text-slate-400">
                                            <i class="fa-regular fa-folder-open text-3xl mb-2 block"></i>
                                            لا توجد طلبات استئذان سابقة مسجلة لك.
                                        </td>

                                ` : myRequests.map(r => `

                                        <td class="p-3.5 font-mono">${r.leaveDate}</td>
                                        <td class="p-3.5 font-bold text-slate-800">${r.timingText} <span class="text-slate-400 text-[11px]">(${r.hours} س)</span></td>
                                        <td class="p-3.5">${this.getStatusBadge(r.status)}</td>
                                        <td class="p-3.5 text-slate-500 max-w-xs truncate">${r.rejectReason || r.reason}</td>
                                        <td class="p-3.5 text-center space-x-1 space-x-reverse">
                                            ${r.status === 'pending' ? `
                                                <button onclick="App.openEditRequestModal('${r.id}')" title="تعديل الطلب" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded-lg">
                                                    <i class="fa-solid fa-pen-to-square"></i>
                                                </button>
                                                <button onclick="App.deleteRequest('${r.id}')" title="إلغاء الطلب" class="p-1.5 text-red-600 hover:bg-red-50 rounded-lg">

                                                    <i class="fa-solid fa-lock ml-1"></i> مقفل
                                                </span>
                                            `}
                                            ${r.status === 'approved' ? `
                                                <button onclick="App.printResolution('${r.id}')" title="طباعة قرار الموافقة" class="p-1.5 text-emerald-700 hover:bg-emerald-50 rounded-lg font-bold">

                                    </tr>
                                `).join("")}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        },

        handleSaveRequest(e) {
            e.preventDefault();
            const type = document.getElementById("reqType").value;
            const leaveDate = document.getElementById("reqLeaveDate").value;
            const reason = document.getElementById("reqReason").value.trim();
            const startD = this.db.settings.workStartTime || "07:30";
            const endD = this.db.settings.workEndTime || "14:30";

            let timingText = "";
            let hours = 0;

            if (type === 'late_in') {
                const timeIn = document.getElementById("reqTimeIn").value;
                timingText = `حضور الساعة ${timeIn}`;
                hours = this.calcHoursDiff(startD, timeIn);
            } else if (type === 'early_out') {
                const timeOut = document.getElementById("reqTimeOut").value;
                timingText = `خروج الساعة ${timeOut}`;
                hours = this.calcHoursDiff(timeOut, endD);
            } else {
                const t1 = document.getElementById("reqTimeStart").value;
                const t2 = document.getElementById("reqTimeReturn").value;
                timingText = `من ${t1} إلى ${t2}`;
                hours = this.calcHoursDiff(t1, t2);
            }

            if (hours <= 0) hours = 0.5;

            const newReq = {
                id: "req_" + Date.now(),
                refNo: "REQ-" + new Date().getFullYear() + "-" + String(this.db.requests.length + 1).padStart(3, '0'),
                userId: this.currentUser.id,
                userName: this.currentUser.name,
                empId: this.currentUser.empId,
                jobTitle: this.currentUser.jobTitle,
                deptId: this.currentUser.deptId,
                sectionName: this.currentUser.sectionName,
                applyDate: new Date().toISOString().split("T")[0],
                leaveDate: leaveDate,
                type: type,
                timingText: timingText,
                hours: hours,
                reason: reason,
                status: "pending",
                decisionBy: "",
                decisionDate: "",
                rejectReason: ""
            };

            this.db.requests.unshift(newReq);
            this.saveDB();
            this.closeModal();
            this.setTab("my_requests");
            alert("تم رفع طلب الاستئذان بنجاح وبانتظار الاعتماد.");
        },

        calcHoursDiff(start, end) {
            const [h1, m1] = start.split(":").map(Number);
            const [h2, m2] = end.split(":").map(Number);
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff < 0) diff = 0;
            return parseFloat((diff / 60).toFixed(1));
        },

        deleteRequest(id) {
            const r = this.db.requests.find(x => x.id === id);
            if (!r) return;
            if (r.status !== 'pending' && this.currentUser.role !== 'super_admin') {
                alert("لا يمكن حذف الطلب بعد صدور القرار الإداري بشأنه!");
                return;
            }
            if (confirm("هل تريد حذف طلب الاستئذان هذا؟")) {
                this.db.requests = this.db.requests.filter(x => x.id !== id);
                this.saveDB();
                this.setTab("my_requests");
            }
        },

            req.decisionBy = this.currentUser.name;
            req.decisionDate = new Date().toISOString().split("T")[0];
            req.decisionSign = this.currentUser.signatureData || "";

            this.saveDB();
            this.closeModal();
            this.setTab("approvals");
